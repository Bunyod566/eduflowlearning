    <style>
        :root {
            --violet: #6c5ce7;
            --cyan: #22d3ee;
            --ink: #0e1030;
        }

        body {
            font-family: 'Manrope', sans-serif;
        }

        h1,
        h2,
        .font-display {
            font-family: 'Unbounded', 'Manrope', sans-serif;
            letter-spacing: -0.02em;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(60rem 40rem at 90% -10%, rgba(108, 92, 231, .14), transparent 60%), radial-gradient(50rem 35rem at -10% 45%, rgba(34, 211, 238, .10), transparent 60%);
        }

        ::selection {
            background: var(--violet);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--violet), var(--cyan));
            border-radius: 99px;
        }

        #scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0;
            z-index: 100;
            background: linear-gradient(90deg, #6c5ce7, #22d3ee, #f59e0b);
        }

        .bg-blue-600 {
            background-image: linear-gradient(135deg, #7c6cf5, #2563eb);
            box-shadow: 0 8px 24px -10px rgba(99, 102, 241, .7);
        }

        .bg-blue-600:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        button,
        a {
            transition: transform .2s, filter .2s, background-color .2s, color .2s;
        }

        :focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
        }

        .course-card {
            transition: transform .35s, box-shadow .35s, border-color .35s;
        }

        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 26px 50px -22px rgba(108, 92, 231, .55);
            border-color: rgba(108, 92, 231, .55);
        }

        .hero {
            background: var(--ink);
            --sx: 72%;
            --sy: 30%;
            --mx: 0;
            --my: 0;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(26rem 26rem at var(--sx) var(--sy), rgba(108, 92, 231, .5), transparent 65%);
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .35;
            background-image: linear-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .07) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at 70% 40%, #000, transparent 75%);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .5;
            animation: drift 14s ease-in-out infinite alternate;
        }

        @keyframes drift {
            to {
                transform: translate(50px, -30px) scale(1.15);
            }
        }

        .grad-text {
            background: linear-gradient(90deg, #8b7cf6, #22d3ee, #fbbf24, #8b7cf6);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: sheen 8s linear infinite;
        }

        @keyframes sheen {
            to {
                background-position: 300% 0;
            }
        }

        .rise {
            opacity: 0;
            transform: translateY(20px);
            animation: rise .9s cubic-bezier(.2, .7, .2, 1) forwards;
            animation-delay: var(--d, 0s);
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: none;
            }
        }

        .float-card {
            transition: transform .18s ease-out;
            transform: translate3d(calc(var(--mx) * var(--z) * 1px), calc(var(--my) * var(--z) * 1px), 0) rotate(var(--r));
        }

        .marquee {
            overflow: hidden;
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
        }

        .marquee-track {
            display: flex;
            gap: .75rem;
            width: max-content;
            animation: marquee 32s linear infinite;
        }

        .marquee:hover .marquee-track {
            animation-play-state: paused;
        }

        @keyframes marquee {
            to {
                transform: translateX(-50%);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            .rise {
                opacity: 1;
                transform: none;
            }
        }

        .smooth-scroll {
            scroll-behavior: smooth;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }

        .dark .glass {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
        }

    const lc = s => String(s || '').trim().toLowerCase();
    const pkey = e => encodeURIComponent(lc(e));
    const two = n => String(n).padStart(2, '0');
    const dt = iso => { const d = new Date(iso); return isNaN(d) ? '-' : two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' + d.getFullYear(); };
    const card = 'bg-white dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-xl';
    const muted = 'text-slate-500 dark:text-gray-400';
    const ROLE = { manager: ['Menejer', 'bg-violet-100 dark:bg-violet-900/40 text-violet-700 dark:text-violet-300'], admin: ['Admin', 'bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300'] };
    const ERR = {
        'auth/invalid-credential': "Email yoki parol noto'g'ri.", 'auth/wrong-password': "Parol noto'g'ri.", 'auth/user-not-found': "Bunday akkaunt topilmadi.",
        'auth/invalid-login-credentials': "Email yoki parol noto'g'ri.", 'auth/email-already-in-use': "Bu email bilan akkaunt bor. \"Kirish\" orqali davom eting.",
        'auth/weak-password': "Parol kamida 6 belgidan iborat bo'lsin.", 'auth/invalid-email': "Email manzili noto'g'ri.",
        'auth/too-many-requests': "Juda ko'p urinish. Birozdan so'ng qayta urinib ko'ring.", 'auth/network-request-failed': "Internet aloqasi yo'q.",
        'auth/operation-not-allowed': "Firebase'da Email/Parol usuli yoqilmagan."
    };
    function fsErr(x) {
        const c = x && x.code;
        if (c === 'permission-denied') return "Ruxsat yo'q: Firestore Rules'ni yangilang (firestore.rules).";
        if (c === 'unavailable') return "Internet aloqasi yo'q.";
        return (x && x.message) || c || '';
    }
    function toast(msg, bad) {
        let t = $('#toast');
        if (!t) { document.body.insertAdjacentHTML('beforeend', '<div id="toast" role="status"></div>'); t = $('#toast'); }
        t.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg text-sm font-semibold text-white ' + (bad ? 'bg-rose-600' : 'bg-emerald-600');
        t.textContent = msg; if (window.applyI18nAll) window.applyI18nAll();
        clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), 3500);
    }
    const tr = () => { if (window.applyI18nAll) window.applyI18nAll(); };

    // ===== KIRISH =====
    function showAuth(msg) {
        host().innerHTML = `<div class="max-w-sm mx-auto py-8">
            <h1 class="fd text-2xl font-bold">Menejer paneli</h1>
            <p class="text-sm ${muted} mt-2 mb-6">Menejer paneli faqat menejer uchun. Adminlar shu yerda parol o'rnatadi.</p>
            <form onsubmit="mAuth(event)" class="space-y-4">
                <div class="flex gap-2 p-1 bg-slate-200 dark:bg-gray-700 rounded-lg">
                    <button type="button" id="m-t-login" onclick="mSetMode('login')" class="flex-1 tbtn">Kirish</button>
                    <button type="button" id="m-t-reg" onclick="mSetMode('register')" class="flex-1 tbtn">Akkaunt yaratish</button>
                </div>
                <div><label class="text-sm font-semibold" for="m-email">Email</label><input id="m-email" type="email" required class="tinp mt-1" autocomplete="email"></div>
                <div><label class="text-sm font-semibold" for="m-pass">Parol</label><input id="m-pass" type="password" required minlength="6" class="tinp mt-1" autocomplete="current-password"></div>
                <p id="m-err" class="text-sm text-rose-600 dark:text-rose-400 min-h-[1.25rem]" role="alert">${esc(msg || '')}</p>
                <button id="m-go" class="tbtn tbp w-full py-3">Kirish</button>
                <button type="button" onclick="mForgot()" class="text-sm text-violet-700 dark:text-violet-400 font-semibold">Parolni unutdim</button>
                <p id="m-hint" class="hidden text-xs ${muted}">Akkaunt yaratish adminlar uchun: avval menejer emailingizni "Adminlar" ro'yxatiga qo'shishi kerak. Keyin shu email va parol bilan admin panelga kirasiz.</p>
            </form></div>`;
        mSetMode(mode); tr();
    }
    function mSetMode(m) {
        mode = m;
        const reg = m === 'register';
        $('#m-go').textContent = reg ? 'Akkaunt yaratish' : 'Kirish';
        $('#m-pass').autocomplete = reg ? 'new-password' : 'current-password';
        $('#m-t-login').className = 'flex-1 tbtn ' + (!reg ? 'bg-white dark:bg-gray-800 shadow' : '');
        $('#m-t-reg').className = 'flex-1 tbtn ' + (reg ? 'bg-white dark:bg-gray-800 shadow' : '');
        $('#m-hint').classList.toggle('hidden', !reg);
        $('#m-err').textContent = ''; tr();
    }
    async function mAuth(e) {
        e.preventDefault(); $('#m-err').textContent = '';
        const em = $('#m-email').value.trim(), pw = $('#m-pass').value;
        try {
            if (mode === 'register') await auth.createUserWithEmailAndPassword(em, pw);
            else await auth.signInWithEmailAndPassword(em, pw);
        } catch (x) { $('#m-err').textContent = ERR[x.code] || x.message; tr(); }
    }
    async function mForgot() {
        const em = $('#m-email').value.trim();
        if (!em) { $('#m-err').textContent = 'Avval email manzilingizni kiriting.'; tr(); return; }
        try { await auth.sendPasswordResetEmail(em); toast('Parolni tiklash havolasi emailga yuborildi.'); }
        catch (x) { $('#m-err').textContent = ERR[x.code] || x.message; tr(); }
    }
    function stopWatch() { unsubs.forEach(u => { try { u(); } catch (e) { } }); unsubs = []; }

    async function onAuth(u) {
        authReady = false; stopWatch(); me = u; role = null;
        if (!u) { authReady = true; showAuth(); return; }
        host().innerHTML = `<p class="py-16 text-center ${muted}">Yuklanmoqda...</p>`; tr();
        const em = lc(u.email);
        if (em === MANAGER_EMAIL) { role = 'manager'; myName = 'Menejer'; }
        else {
            try {
                const d = await db.collection('staff').doc(em).get();
                if (d.exists && d.data().role === 'admin') { role = 'admin'; myName = d.data().name || em; }
            } catch (x) { console.warn('staff:', x && x.message); }
        }
        authReady = true;
        if (role === 'manager') { startWatch(); shell(); render(); }
        else showNoAccess();
    }
    function showNoAccess() {
        const adm = role === 'admin';
        host().innerHTML = `<div class="max-w-md mx-auto py-12 text-center">
            <div class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center ${adm ? 'bg-amber-100 dark:bg-amber-900/40' : 'bg-rose-100 dark:bg-rose-900/40'}"><i class="fa-solid ${adm ? 'fa-user-shield text-amber-600' : 'fa-lock text-rose-600'} text-3xl"></i></div>
            <h1 class="fd text-2xl font-bold mt-5">${adm ? 'Siz adminsiz' : "Menejer huquqi yo'q"}</h1>
            <p class="${muted} mt-3"><span translate="no">${esc(me.email)}</span></p>
            <p class="${muted} mt-2">${adm ? "Menejer paneli faqat menejerlar uchun. Admin panelidan foydalaning." : "Bu email adminlar ro'yxatida yo'q. Menejer sizni qo'shishi kerak."}</p>
            <div class="flex justify-center gap-2 mt-6">${adm ? '<a href="admin.html" class="tbtn tbp">Admin paneli</a>' : ''}<button onclick="mOut()" class="tbtn tbg">Chiqish</button></div></div>`;
        tr();
    }
    const mOut = () => auth.signOut();

    // ===== MA'LUMOTLAR (jonli) =====
    function startWatch() {
        const keep = (name, fn) => db.collection(name).onSnapshot(fn, x => toast(name + ": " + fsErr(x), true));
        unsubs.push(keep('users', s => { users = s.docs.map(d => ({ _id: d.id, ...d.data() })).filter(u => u && u.email).sort((a, b) => (b.registeredAt || '').localeCompare(a.registeredAt || '')); if (tab === 'students') renderBody(); }));
        unsubs.push(keep('points', s => { points = {}; s.forEach(d => { points[d.id] = +d.data().balance || 0; }); if (tab === 'students') renderBody(); }));
        unsubs.push(keep('teachers', s => { teachers = s.docs.map(d => ({ _id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')); if (tab === 'teachers') renderBody(); }));
        unsubs.push(keep('staff', s => { staff = s.docs.map(d => ({ _id: d.id, ...d.data() })).filter(x => x.role === 'admin').sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '')); if (tab === 'staff') renderBody(); }));
    }

    // ===== QOBIQ VA YO'NALISH =====
    const TABS = [['students', 'fa-user-graduate', "O'quvchilar"], ['teachers', 'fa-chalkboard-user', 'Ustozlar'], ['staff', 'fa-user-shield', 'Adminlar']];
    function shell() {
        host().innerHTML = `<nav class="flex flex-wrap items-center gap-2 mb-8 pb-4 border-b border-gray-200 dark:border-gray-800">
            ${TABS.map(([k, ic, l]) => `<a class="tnavb" data-v="${k}" href="#/${k}"><i class="fa-solid ${ic}"></i>${l}</a>`).join('')}
            <span class="ml-auto flex items-center gap-2 text-sm ${muted} min-w-0"><span class="text-xs font-bold px-2 py-0.5 rounded-full ${ROLE[role][1]}">${ROLE[role][0]}</span><span translate="no" class="truncate max-w-[14rem]">${esc(me.email)}</span></span>
            <button onclick="mOut()" class="tbtn tbg">Chiqish</button></nav><div id="m-main"></div>`;
    }
    function route() {
        const t = location.hash.replace(/^#\/?/, '').split('/')[0];
        tab = TABS.some(x => x[0] === t) ? t : 'students';
        q = ''; ptsClose();
        if (role === 'manager') render();
    }
    function render() {
        if (!$('#m-main')) shell();
        document.querySelectorAll('.tnavb[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === tab));
        renderBody();
    }
    function renderBody() {
        const m = $('#m-main'); if (!m) return;
        const fx = document.activeElement && document.activeElement.id === 'm-q' ? document.activeElement.selectionStart : null;
        m.innerHTML = tab === 'teachers' ? vTeachers() : tab === 'staff' ? vStaff() : vStudents();
        if (fx !== null && $('#m-q')) { const i = $('#m-q'); i.focus(); try { i.setSelectionRange(fx, fx); } catch (e) { } }
        tr();
    }
    const match = (...xs) => { const s = q.trim().toLowerCase(); return !s || xs.some(x => String(x || '').toLowerCase().includes(s)); };
    function toolbar(count, placeholder, delLabel) {
        return `<div class="flex flex-wrap items-center gap-3 mb-4">
            <input id="m-q" value="${esc(q)}" oninput="mQ(this.value)" class="tinp flex-1 min-w-[14rem] max-w-md" placeholder="${placeholder}" autocomplete="off">
            ${delLabel ? `<label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" ${showDeleted ? 'checked' : ''} onchange="mDel(this.checked)" class="w-4 h-4"><span>${delLabel}</span></label>` : ''}
            <span class="ml-auto text-sm ${muted}"><span>Jami:</span> <b>${count}</b></span></div>`;
    }
    function mQ(v) { q = v; renderBody(); }
    function mDel(v) { showDeleted = v; renderBody(); }

    // ===== O'QUVCHILAR =====
    function vStudents() {
        const list = users.filter(u => (showDeleted ? u.deleted : !u.deleted) && match(u.name, u.email));
        const head = `<h1 class="fd text-2xl font-bold mb-5">O'quvchilar</h1>` + toolbar(list.length, "Ism yoki email bo'yicha qidiring", "O'chirilganlar");
        if (!list.length) return head + `<p class="${muted}">${showDeleted ? "O'chirilgan o'quvchi yo'q." : "O'quvchi topilmadi."}</p>`;
        return head + `<ul class="space-y-2">${list.map(u => {
            const bal = points[pkey(u.email)] || 0;
            return `<li class="${card} px-4 py-3 flex flex-wrap items-center gap-3 ${u.deleted ? 'opacity-70' : ''}">
                <span class="w-10 h-10 rounded-full bg-violet-100 dark:bg-violet-900/40 text-violet-700 dark:text-violet-300 flex items-center justify-center font-bold shrink-0">${esc(String(u.name || u.email).charAt(0).toUpperCase())}</span>
                <div class="flex-1 min-w-[10rem]"><div translate="no" class="font-semibold truncate">${esc(u.name || '-')}${u.isPro ? ' <span class="text-[10px] font-black px-1.5 py-0.5 rounded bg-amber-400 text-gray-900 align-middle">PRO</span>' : ''}</div>
                    <div class="text-xs ${muted} truncate"><span translate="no">${esc(u.email)}</span> · <span>${dt(u.registeredAt)}</span></div></div>
                <div class="text-lg font-bold min-w-[4.5rem] text-right"><i class="fa-solid fa-coins text-amber-500 mr-1"></i>${bal}</div>
                <div class="flex gap-1.5">${u.deleted
                    ? `<button onclick="mStudentDel('${esc(u._id)}',false)" class="tbtn tbg"><i class="fa-solid fa-rotate-left mr-1"></i>Tiklash</button>`
                    : `<button onclick="mPts('${esc(u._id)}',1)" class="tbtn bg-emerald-600 text-white" aria-label="Ball qo'shish"><i class="fa-solid fa-plus"></i></button>
                       <button onclick="mPts('${esc(u._id)}',-1)" class="tbtn bg-rose-600 text-white" aria-label="Ball ayirish"><i class="fa-solid fa-minus"></i></button>
                       <button onclick="mStudentDel('${esc(u._id)}',true)" class="tbtn tbg text-rose-600" aria-label="O'chirish"><i class="fa-solid fa-trash"></i></button>`}</div></li>`;
        }).join('')}</ul>`;
    }
    async function mStudentDel(id, del) {
        const u = users.find(x => x._id === id); if (!u) return;
        if (del && !confirm(`"${u.name || u.email}" o'quvchi akkauntini o'chirasizmi? U saytga kira olmaydi. Ballari saqlanib qoladi, keyin tiklash mumkin.`)) return;
        try { await db.collection('users').doc(id).update({ deleted: del }); toast(del ? "O'quvchi o'chirildi." : "O'quvchi tiklandi."); }
        catch (x) { toast('Saqlanmadi. ' + fsErr(x), true); }
    }

    // --- Ball modal oynasi (1-qator miqdor, 2-qator izoh) ---
    function mPts(id, sign) {
        const u = users.find(x => x._id === id); if (!u) return;
        ptsClose(); ptsCtx = { u, sign };
        const add = sign > 0, bal = points[pkey(u.email)] || 0;
        document.body.insertAdjacentHTML('beforeend', `
        <div id="pts-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" onmousedown="if(event.target===this)mPtsClose()">
            <form novalidate onsubmit="mPtsGo(event)" role="dialog" aria-modal="true" aria-labelledby="pts-title"
                class="bg-white dark:bg-gray-800 text-slate-800 dark:text-gray-100 rounded-2xl w-full max-w-sm p-6 shadow-2xl border border-slate-200 dark:border-gray-700">
                <div class="flex items-start gap-3 mb-5">
                    <span class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${add ? 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600' : 'bg-rose-100 dark:bg-rose-900/40 text-rose-600'}"><i class="fa-solid ${add ? 'fa-plus' : 'fa-minus'}"></i></span>
                    <div class="min-w-0"><h2 id="pts-title" class="fd text-lg font-bold leading-tight">${add ? "Ball qo'shish" : 'Ball ayirish'}</h2>
                    <p class="text-sm ${muted} mt-1 truncate"><span translate="no">${esc(u.name || u.email)}</span> · <span>hozir</span> <b>${bal}</b> <span>ball</span></p></div>
                </div>
                <label for="pts-amt" class="text-sm font-semibold">Necha ball</label>
                <input id="pts-amt" type="number" inputmode="numeric" min="1" max="10000" step="1" required value="10" class="tinp mt-1 text-lg font-bold">
                <div class="flex flex-wrap gap-1.5 mt-2">${[5, 10, 50, 100, 500].map(n => `<button type="button" onclick="document.getElementById('pts-amt').value=${n}" class="tbtn tbg !px-3 !py-1">${n}</button>`).join('')}</div>
                <label for="pts-reason" class="text-sm font-semibold block mt-4">Nima uchun (izoh)</label>
                <input id="pts-reason" maxlength="100" class="tinp mt-1" placeholder="Masalan: olimpiadada g'olib bo'ldi" autocomplete="off">
                <p id="pts-err" class="text-sm text-rose-600 dark:text-rose-400 min-h-[1.25rem] mt-2" role="alert"></p>
                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="mPtsClose()" class="tbtn tbg">Bekor qilish</button>
                    <button id="pts-go" class="tbtn text-white ${add ? 'bg-emerald-600' : 'bg-rose-600'}">${add ? "Qo'shish" : 'Ayirish'}</button>
                </div>
            </form></div>`);
        tr(); const a = $('#pts-amt'); a.focus(); a.select();
        document.addEventListener('keydown', ptsKey);
    }
    function ptsKey(e) { if (e.key === 'Escape') ptsClose(); }
    function ptsClose() { document.removeEventListener('keydown', ptsKey); const m = $('#pts-modal'); if (m) m.remove(); ptsCtx = null; }
    async function mPtsGo(e) {
        e.preventDefault();
        const ctx = ptsCtx; if (!ctx || busy) return;
        const amt = parseInt($('#pts-amt').value, 10), reason = $('#pts-reason').value.trim().slice(0, 100);
        const err = $('#pts-err'), btn = $('#pts-go');
        if (!(amt >= 1 && amt <= 10000)) { err.textContent = "1 dan 10000 gacha son kiriting."; tr(); return; }
        busy = true; btn.disabled = true; btn.classList.add('opacity-60');
        const u = ctx.u, key = pkey(u.email), ref = db.collection('points').doc(key), logRef = db.collection('pointLog').doc(), now = new Date().toISOString();
        try {
            let real = 0;
            await db.runTransaction(async t => {
                const d = await t.get(ref), cur = d.exists ? (+d.data().balance || 0) : 0, nb = Math.max(0, cur + ctx.sign * amt);
                real = nb - cur; if (!real) return;
                t.set(ref, { email: u.email.trim(), name: u.name || '', balance: nb, updatedAt: now });
                t.set(logRef, { key, email: u.email.trim(), name: u.name || '', delta: real, reason, groupId: '', groupName: 'Menejer', teacherUid: me.uid, teacherName: myName, createdAt: now });
            });
            if (!real) { err.textContent = "Ball 0 dan kam bo'lmaydi."; tr(); btn.disabled = false; btn.classList.remove('opacity-60'); busy = false; return; }
            ptsClose(); toast(ctx.sign > 0 ? "Ball qo'shildi." : 'Ball ayirildi.');
        } catch (x) { if ($('#pts-err')) { err.textContent = 'Saqlanmadi. ' + fsErr(x); tr(); btn.disabled = false; btn.classList.remove('opacity-60'); } }
        busy = false;
    }

    // ===== USTOZLAR =====
    const TST = { pending: ['Kutmoqda', 'bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300'], approved: ['Tasdiqlangan', 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-300'], rejected: ['Rad etilgan', 'bg-rose-100 dark:bg-rose-900/40 text-rose-800 dark:text-rose-300'], deleted: ["O'chirilgan", 'bg-slate-200 dark:bg-gray-700 text-slate-700 dark:text-gray-300'] };
    function vTeachers() {
        const list = teachers.filter(t => (showDeleted ? t.approval === 'deleted' : t.approval !== 'deleted') && match(t.name, t.email, t.specialty));
        const head = `<h1 class="fd text-2xl font-bold mb-5">Ustozlar</h1>` + toolbar(list.length, "Ism, email yoki yo'nalish bo'yicha qidiring", "O'chirilganlar");
        if (!list.length) return head + `<p class="${muted}">${showDeleted ? "O'chirilgan ustoz yo'q." : 'Ustoz topilmadi.'}</p>`;
        return head + `<ul class="space-y-2">${list.map(t => {
            const s = TST[t.approval || 'pending'] || TST.pending;
            return `<li class="${card} px-4 py-3 flex flex-wrap items-center gap-3">
                <div class="flex-1 min-w-[12rem]"><div class="flex flex-wrap items-center gap-2"><span translate="no" class="font-semibold">${esc(t.name || '-')}</span><span class="text-xs font-bold px-2 py-0.5 rounded-full ${s[1]}">${s[0]}</span></div>
                    <div class="text-xs ${muted}"><span translate="no">${esc(t.email || '')}</span>${t.specialty ? ` · <span>${esc(t.specialty)}</span>` : ''} · <span>${dt(t.createdAt)}</span></div></div>
                ${t.approval === 'deleted'
                    ? `<button onclick="mTeacherDel('${esc(t._id)}',false)" class="tbtn tbg"><i class="fa-solid fa-rotate-left mr-1"></i>Tiklash</button>`
                    : `<button onclick="mTeacherDel('${esc(t._id)}',true)" class="tbtn tbg text-rose-600"><i class="fa-solid fa-trash mr-1"></i>O'chirish</button>`}</li>`;
        }).join('')}</ul><p class="text-xs ${muted} mt-4">O'chirilgan ustoz ustozlar saytida hech narsa qila olmaydi. Uning kurslari va o'quvchilarining ballari saqlanib qoladi.</p>`;
    }
    async function mTeacherDel(id, del) {
        const t = teachers.find(x => x._id === id); if (!t) return;
        if (del && !confirm(`"${t.name || t.email}" ustoz akkauntini o'chirasizmi? U kurs yarata olmaydi, ball bera olmaydi va davomat qila olmaydi. Keyin tiklash mumkin.`)) return;
        if (!del && !confirm(`"${t.name || t.email}" ni tiklaysizmi? U tasdiqlangan ustoz bo'ladi.`)) return;
        try {
            await db.collection('teachers').doc(id).update(del ? { approval: 'deleted', approvalReason: "Akkaunt menejer tomonidan o'chirildi." } : { approval: 'approved', approvalReason: '' });
            toast(del ? "Ustoz o'chirildi." : 'Ustoz tiklandi.');
        } catch (x) { toast('Saqlanmadi. ' + fsErr(x), true); }
    }

    // ===== ADMINLAR =====
    function vStaff() {
        const list = staff.filter(s => match(s.name, s.email));
        const meRow = match('Menejer', MANAGER_EMAIL) ? `<li class="${card} px-4 py-3 flex flex-wrap items-center gap-3">
                <div class="flex-1 min-w-[12rem]"><div class="flex items-center gap-2"><span class="font-semibold">Menejer</span><span class="text-xs font-bold px-2 py-0.5 rounded-full ${ROLE.manager[1]}">${ROLE.manager[0]}</span><span class="text-xs ${muted}">(siz)</span></div>
                <div class="text-xs ${muted}"><span translate="no">${MANAGER_EMAIL}</span></div></div></li>` : '';
        return `<h1 class="fd text-2xl font-bold mb-5">Adminlar</h1>
            <form onsubmit="mStaffAdd(event)" class="${card} p-4 mb-6 grid sm:grid-cols-[1fr_1fr_auto] gap-3 items-end">
                <div><label class="text-sm font-semibold" for="s-email">Email</label><input id="s-email" type="email" required class="tinp mt-1" placeholder="admin@gmail.com" autocomplete="off"></div>
                <div><label class="text-sm font-semibold" for="s-name">Ism</label><input id="s-name" maxlength="60" class="tinp mt-1" autocomplete="off"></div>
                <button class="tbtn tbp"><i class="fa-solid fa-plus mr-1"></i>Admin qo'shish</button>
            </form>
            ${toolbar(list.length, "Ism yoki email bo'yicha qidiring", '')}
            <ul class="space-y-2">${meRow}${list.map(s => `<li class="${card} px-4 py-3 flex flex-wrap items-center gap-3">
                    <div class="flex-1 min-w-[12rem]"><div class="flex flex-wrap items-center gap-2"><span translate="no" class="font-semibold">${esc(s.name || s.email)}</span><span class="text-xs font-bold px-2 py-0.5 rounded-full ${ROLE.admin[1]}">${ROLE.admin[0]}</span></div>
                    <div class="text-xs ${muted}"><span translate="no">${esc(s.email)}</span> · <span>${dt(s.createdAt)}</span></div></div>
                    <button onclick="mStaffDel('${esc(s._id)}')" class="tbtn tbg text-rose-600"><i class="fa-solid fa-trash mr-1"></i>O'chirish</button></li>`).join('')}</ul>
            ${list.length ? '' : `<p class="${muted} mt-3">Hali admin yo'q. Yuqoridagi forma orqali qo'shing.</p>`}
            <div class="text-xs ${muted} mt-5 space-y-1">
                <p>Admin admin panelida (admin.html) ustozlarni, kurslarni, sharhlarni va Edu-Shop buyurtmalarini boshqaradi.</p>
                <p>Yangi admin shu sahifadagi "Akkaunt yaratish" orqali o'sha email bilan parol o'rnatadi.</p>
            </div>`;
    }
    async function mStaffAdd(e) {
        e.preventDefault();
        const em = lc($('#s-email').value), name = $('#s-name').value.trim().slice(0, 60);
        if (!/^[^\s@/]+@[^\s@/]+\.[^\s@/]{2,}$/.test(em)) { toast("Email manzili noto'g'ri.", true); return; }
        if (em === MANAGER_EMAIL) { toast("Bu sizning (menejer) emailingiz. Uni qo'shish shart emas.", true); return; }
        if (staff.some(s => lc(s.email) === em)) { toast("Bu email allaqachon adminlar ro'yxatida.", true); return; }
        try {
            await db.collection('staff').doc(em).set({ email: em, name, role: 'admin', addedBy: lc(me.email), createdAt: new Date().toISOString() });
            toast("Admin qo'shildi."); e.target.reset();
        } catch (x) { toast('Saqlanmadi. ' + fsErr(x), true); }
    }
    async function mStaffDel(id) {
        const s = staff.find(x => x._id === id); if (!s) return;
        if (!confirm(`"${s.name || s.email}" ni adminlardan o'chirasizmi? U admin huquqlarini yo'qotadi.`)) return;
        try { await db.collection('staff').doc(id).delete(); toast("Admin o'chirildi."); }
        catch (x) { toast("O'chirilmadi. " + fsErr(x), true); }
    }

    Object.assign(window, { mAuth, mSetMode, mForgot, mOut, mQ, mDel, mStudentDel, mPts, mPtsGo, mPtsClose: ptsClose, mTeacherDel, mStaffAdd, mStaffDel });
    window.addEventListener('hashchange', route);
    window.managerStart = function () {
        fbApp = firebase.initializeApp(FIREBASE_CONFIG, 'manager');
        auth = fbApp.auth(); db = fbApp.firestore();
        const t = location.hash.replace(/^#\/?/, '').split('/')[0];
        if (TABS.some(x => x[0] === t)) tab = t;
        host().innerHTML = `<p class="py-16 text-center ${muted}">Yuklanmoqda...</p>`;
        auth.onAuthStateChanged(onAuth);
    };
})();

        ["Full-stack Web Dasturlash (Python & React)", "Full-stack Web Development (Python & React)", "Full-stack веб-разработка (Python и React)"],
        ["UI/UX Dizayn va Figma asoslari", "UI/UX Design and Figma Basics", "Основы UI/UX-дизайна и Figma"],
        ["SMM va Zamonaviy Marketing", "SMM and Modern Marketing", "SMM и современный маркетинг"],
        ["Ingliz tili: Beginner'dan IELTS 7.5'gacha", "English: From Beginner to IELTS 7.5", "Английский: от Beginner до IELTS 7.5"],
        ["Biznes va Startap asoslari", "Business and Startup Basics", "Основы бизнеса и стартапов"],
        ["Mobile App Development: Flutter", "Mobile App Development: Flutter", "Разработка мобильных приложений: Flutter"],
        ["Grafik Dizayn: Photoshop va Illustrator", "Graphic Design: Photoshop and Illustrator", "Графический дизайн: Photoshop и Illustrator"],

        ["Data Science va Machine Learning Python'da", "Data Science and Machine Learning in Python", "Data Science и машинное обучение на Python"],
        ["Ushbu interaktiv kurs orqali siz noldan boshlab professional ko'nikmalarni egallaysiz va amaliy loyihalar ustida ishlaysiz.", "With this interactive course you will master professional skills from scratch and work on practical projects.", "На этом интерактивном курсе вы с нуля освоите профессиональные навыки и поработаете над практическими проектами."],
        ["Python va React yordamida veb-ilovaning ham server (backend), ham ko'rinadigan (frontend) qismini yaratishga yo'naltirilgan kurs. Darslar dasturlash asoslaridan boshlanadi: o'zgaruvchilar va ma'lumot turlari, if / else shartlari, sikllar va funksiyalar. Dasturlashda tajribangiz bo'lmasa ham boshlashingiz mumkin.", "A course aimed at building both the server (backend) and the visible (frontend) parts of a web app with Python and React. The lessons start with programming basics: variables and data types, if / else conditions, loops and functions. You can start even with no programming experience.", "Курс о создании и серверной (backend), и видимой (frontend) части веб-приложения на Python и React. Уроки начинаются с основ программирования: переменные и типы данных, условия if / else, циклы и функции. Начать можно даже без опыта в программировании."],
        ["Foydalanuvchi tajribasi (UX) va interfeys dizayni asoslari hamda Figma dasturida amaliy ishlash kursi. Darslarda UX nima ekanligi, Figma muhiti, rang va shriftni to'g'ri tanlash va interfeys prototipini yaratish ko'riladi.", "A course on the basics of user experience (UX) and interface design, with hands-on work in Figma. The lessons cover what UX is, the Figma workspace, choosing colors and fonts, and building an interface prototype.", "Курс по основам пользовательского опыта (UX) и дизайна интерфейсов с практической работой в Figma. На уроках разбираются: что такое UX, рабочая среда Figma, выбор цветов и шрифтов и создание прототипа интерфейса."],
        ["Ijtimoiy tarmoqlarda biznesni targ'ib qilishning zamonaviy usullari kursi: maqsadli auditoriyani aniqlash, kontent reja tuzish, reklama yuritish va natijalarni tahlil qilish. SMM mutaxassisi bo'lmoqchi yoki o'z biznesini tarmoqlarda rivojlantirmoqchi bo'lganlarga mos.", "A course on modern ways to promote a business on social media: defining the target audience, planning content, running ads and analyzing the results. Suitable for those who want to become an SMM specialist or grow their own business on social networks.", "Курс о современных способах продвижения бизнеса в социальных сетях: определение целевой аудитории, составление контент-плана, запуск рекламы и анализ результатов. Подходит тем, кто хочет стать SMM-специалистом или развивать свой бизнес в соцсетях."],
        ["Ingliz tilini Beginner darajasidan boshlab o'rganish kursi; IELTS tayyorgarligi uchun zarur lug'at va grammatika poydevorini yaratadi. Darslarda mavzuli so'zlar (salomlashish, oila, ovqat, sayohat, ish, vaqt, uy, sifatlar) talaffuzi bilan, grammatika esa (to be, Present Simple, artikllar, ko'plik, Past Simple, Present Continuous, will, qiyoslash darajasi) misol va mashqlar bilan o'rgatiladi.", "An English course starting from Beginner level that builds the vocabulary and grammar foundation needed for IELTS preparation. Thematic words (greetings, family, food, travel, work, time, home, adjectives) are taught with pronunciation, and grammar (to be, Present Simple, articles, plurals, Past Simple, Present Continuous, will, comparatives) with examples and exercises.", "Курс английского языка с уровня Beginner, который создаёт словарный и грамматический фундамент для подготовки к IELTS. Тематические слова (приветствия, семья, еда, путешествия, работа, время, дом, прилагательные) даются с произношением, а грамматика (to be, Present Simple, артикли, множественное число, Past Simple, Present Continuous, will, степени сравнения) — с примерами и упражнениями."],
        ["Biznes va startap asoslari kursi: g'oyani real muammoga bog'lash va mijozlardan so'rab tekshirish, biznes modelni (kimga, nima va qanday sotish, daromad va xarajatlar) tuzish, marketing va birinchi qadamlar. O'z ishini boshlamoqchi bo'lganlar uchun.", "A course on business and startup basics: tying an idea to a real problem and testing it with customers, building a business model (who you sell to, what and how, revenue and costs), marketing, and the first steps. For those who want to start their own business.", "Курс по основам бизнеса и стартапов: связать идею с реальной проблемой и проверить её на клиентах, построить бизнес-модель (кому, что и как продавать, доходы и расходы), маркетинг и первые шаги. Для тех, кто хочет начать своё дело."],
        ["Dart tilida Flutter yordamida mobil ilovalar yaratish kursi. Darslarda widgetlar, Stateless va Stateful widgetlar, ekranlar orasida navigatsiya hamda API bilan ishlash ko'riladi.", "A course on building mobile apps with Flutter in the Dart language. The lessons cover widgets, Stateless and Stateful widgets, navigation between screens, and working with APIs.", "Курс по созданию мобильных приложений на Flutter (язык Dart). На уроках разбираются виджеты, Stateless и Stateful виджеты, навигация между экранами и работа с API."],
        ["Grafik dizayn asoslari va Photoshop hamda Illustrator dasturlarida ishlash kursi: kompozitsiya qoidalari, Photoshop qatlamlari va maskalar, Illustrator'da vektor grafika va tayyor ishni to'g'ri formatda eksport qilish.", "A course on graphic design basics and working in Photoshop and Illustrator: composition rules, Photoshop layers and masks, vector graphics in Illustrator, and exporting finished work in the right format.", "Курс по основам графического дизайна и работе в Photoshop и Illustrator: правила композиции, слои и маски в Photoshop, векторная графика в Illustrator и экспорт готовой работы в нужном формате."],
        ["Ispan tilini noldan o'rganib, so'zlashuv ko'nikmasini shakllantirish kursi. Salomlashish, ovqat va sayohat mavzularidagi so'zlar hamda artikllar (el / la) va ser fe'li kabi dastlabki grammatika qoidalari misollar va mashqlar bilan o'rgatiladi.", "A course for learning Spanish from scratch and building speaking skills. Words on greetings, food and travel are taught together with basic grammar such as articles (el / la) and the verb ser, using examples and exercises.", "Курс испанского языка с нуля для развития разговорных навыков. Слова на темы приветствий, еды и путешествий изучаются вместе с базовой грамматикой — артикли (el / la) и глагол ser — с примерами и упражнениями."],
        ["Moliya va buxgalteriya asoslari kursi: pul oqimini yuritish, aktiv, majburiyat va kapital, debet va kredit, byudjet tuzish (50/30/20 qoidasi) hamda soliqlar bilan tanishuv.", "A course on finance and accounting basics: managing cash flow, assets, liabilities and equity, debit and credit, budgeting (the 50/30/20 rule), and an introduction to taxes.", "Курс по основам финансов и бухгалтерии: управление денежным потоком, активы, обязательства и капитал, дебет и кредит, составление бюджета (правило 50/30/20) и знакомство с налогами."],

    const norm = s => s.replace(/\s+/g, ' ').trim();
    const MAP = new Map();
    D.forEach(([u, e, r, uo]) => MAP.set(norm(u), { uz: uo, en: e, ru: r }));

    const planL = (x, l) => { const e = MAP.get(x); return e ? (l === 'uz' ? x : e[l]) : x; };
    const dayW = { uz: 'kun', en: 'days', ru: 'дн.' };
    const P = [
        { re: /^(\d+) ta dars$/, en: m => `${m[1]} lessons`, ru: m => `${m[1]} уроков` },
        { re: /^(.*) \((\d+) sharhlar\)$/, en: m => `${m[1]} (${m[2]} reviews)`, ru: m => `${m[1]} (${m[2]} отзывов)` },
        { re: /^Saqlangan Kurslar \((\d+)\)$/, en: m => `Saved Courses (${m[1]})`, ru: m => `Сохранённые курсы (${m[1]})` },
        { re: /^(1 oylik|1 yillik) · (.+) gacha$/, en: m => `${planL(m[1], 'en')} · until ${m[2]}`, ru: m => `${planL(m[1], 'ru')} · до ${m[2]}` },
        {
            re: /^PRO (\S+) gacha \((\d+) kun qoldi\)(\. Yangi obuna muddatni uzaytiradi\.)?$/,
            en: m => `PRO until ${m[1]} (${m[2]} days left)` + (m[3] ? '. A new subscription extends the period.' : ''),
            ru: m => `PRO до ${m[1]} (осталось ${m[2]} дн.)` + (m[3] ? '. Новая подписка продлит срок.' : '')
        },
        { re: /^Kod yuborilmadi\. Birozdan so'ng qayta urinib ko'ring\.(?: \(([\s\S]*)\))?$/, en: m => `The code could not be sent. Please try again in a moment.${m[1] ? ` (${m[1]})` : ''}`, ru: m => `Не удалось отправить код. Повторите попытку чуть позже.${m[1] ? ` (${m[1]})` : ''}` },
        { re: /^Qayta yuborish \((\d+) s\)$/, en: m => `Resend (${m[1]} s)`, ru: m => `Отправить снова (${m[1]} с)` },
        { re: /^Kod (.+) manziliga yuborildi\. 10 daqiqa amal qiladi\.$/, en: m => `The code was sent to ${m[1]}. It is valid for 10 minutes.`, ru: m => `Код отправлен на ${m[1]}. Действителен 10 минут.` },
        { re: /^Test rejimi: email xizmati ulanmagan\. Kod: (\d+)$/, en: m => `Test mode: email service is not connected. Code: ${m[1]}`, ru: m => `Тестовый режим: почтовый сервис не подключён. Код: ${m[1]}` },
        { re: /^Obunani tasdiqlash \((.+)\)$/, en: m => `Confirm subscription (${m[1]})`, ru: m => `Подтвердить подписку (${m[1]})` },
        { re: /^Muddati: (\d+) kun qoldi$/, en: m => `Due: ${m[1]} days left`, ru: m => `Срок: осталось ${m[1]} дн.` },
        { re: /^Kurs videosi(.*)$/, en: m => `Course video${m[1]}`, ru: m => `Видео курса${m[1]}` },
        { re: /^(.+) #(\d+)$/, en: m => MAP.has(m[1]) ? `${MAP.get(m[1]).en} #${m[2]}` : null, ru: m => MAP.has(m[1]) ? `${MAP.get(m[1]).ru} #${m[2]}` : null },

        { re: /^"(.*)" foydalanuvchini o'chirmoqchimisiz\?$/, en: m => `Delete user "${m[1]}"?`, ru: m => `Удалить пользователя «${m[1]}»?` },
        { re: /^Import tugadi: (\d+) ta yangi, (\d+) ta yangilandi\.$/, en: m => `Import finished: ${m[1]} new, ${m[2]} updated.`, ru: m => `Импорт завершён: новых — ${m[1]}, обновлено — ${m[2]}.` },

            ru: m => `Поздравляем! PRO (${planL(m[1], 'ru')}) активирован. Действует до: ${m[2]}.`
        },
        {
            re: /^Kurs #(\d+) yangilandi: narx (.+) UZS(, video saqlandi)?\.$/,
            en: m => `Course #${m[1]} updated: price ${m[2]} UZS${m[3] ? ', video saved' : ''}.`,

            ru: m => `${m[3].startsWith('shu') ? 'Применить это видео к' : 'Удалить видео у'} ${m[2]} курсам категории «${MAP.has(m[1]) ? MAP.get(m[1]).ru : m[1]}»?`
        }
    ];

    function tr(raw, lang) {
        const key = norm(raw);
        if (!key) return null;
        const e = MAP.get(key);
        if (e) return lang === 'uz' ? (e.uz !== undefined ? e.uz : null) : e[lang];
        if (lang === 'uz') return null;
        for (const p of P) {
            const m = key.match(p.re);
            if (m) { const out = p[lang](m); if (out) return out; }
        }
        return null;
    }
    const L = () => (typeof currentLang !== 'undefined' && currentLang) || 'uz';

    const noTr = n => { const e = n.nodeType === 1 ? n : n.parentElement; return !!(e && e.closest && e.closest('[translate="no"]')); };
    function doText(n) {
        if (noTr(n)) return;
        const cur = n.nodeValue, lang = L();
        const src = (n.__t !== undefined && cur === n.__t) ? n.__o : cur;
        const t = tr(src, lang);
        if (t !== null) {
            const lead = src.match(/^\s*/)[0], trail = src.match(/\s*$/)[0];
            const out = lead + t + trail;
            if (cur !== out) n.nodeValue = out;
            n.__o = src; n.__t = out;
        } else if (src !== cur) {
            n.nodeValue = src; n.__t = undefined; n.__o = undefined;
        }
    }
    const ATTRS = ['placeholder', 'title', 'aria-label', 'alt'];
    function doEl(el) {
        const lang = L();
        el.__a = el.__a || {};
        for (const a of ATTRS) {
            if (!el.hasAttribute(a)) continue;
            const cur = el.getAttribute(a), rec = el.__a[a];
            const src = (rec && cur === rec.t) ? rec.o : cur;
            const t = tr(src, lang);
            if (t !== null) { if (cur !== t) el.setAttribute(a, t); el.__a[a] = { o: src, t }; }
            else if (src !== cur) { el.setAttribute(a, src); delete el.__a[a]; }
        }
    }
    function walk(root) {
        if (root.nodeType === 3) { doText(root); return; }
        if (root.nodeType !== 1) return;
        const tag = root.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || noTr(root)) return;
        doEl(root);
        const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
            acceptNode: n => (n.nodeType === 1 && (n.tagName === 'SCRIPT' || n.tagName === 'STYLE' || n.getAttribute('translate') === 'no')) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
        });
        let n;
        while ((n = w.nextNode())) { if (n.nodeType === 3) doText(n); else doEl(n); }
    }

    const TITLES = { uz: "EduFlow - Onlayn Ta'lim Platformasi", en: "EduFlow - Online Education Platform", ru: "EduFlow — онлайн-платформа обучения" };
    const OPTS = { childList: true, subtree: true, characterData: true };
    const mo = new MutationObserver(recs => {
        mo.disconnect();
        try {
            for (const r of recs) {
                if (r.type === 'characterData') doText(r.target);
                else r.addedNodes.forEach(walk);
            }
        } finally { mo.observe(document.body, OPTS); }
    });
    function applyAll() {
        mo.disconnect();
        try {
            const l = L();
            document.documentElement.lang = l;
            document.title = (window.pageTitle && window.pageTitle(l)) || TITLES[l] || TITLES.uz;
            walk(document.body);
        } finally { mo.observe(document.body, OPTS); }
    }

    // alert / confirm xabarlarini tarjima qilish
    const _alert = window.alert.bind(window), _confirm = window.confirm.bind(window);
    const msg = m => { const s = String(m); const t = tr(s, L()); return t !== null ? t : s; };
    window.alert = m => _alert(msg(m));
    window.confirm = m => _confirm(msg(m));

    // Til almashganda butun sahifani (modal, footer, admin) qayta tarjima qilish
    const _change = window.changeLanguage;
    window.changeLanguage = function (lang) { _change(lang); applyAll(); };

    window.applyI18nAll = applyAll;
    applyAll();
    document.addEventListener('DOMContentLoaded', applyAll);
    window.addEventListener('load', applyAll);
})();
