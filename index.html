    <style>
        :root {
            --violet: #6c5ce7;
            --cyan: #22d3ee;
            --ink: #0e1030;
        }

        body {
            font-family: 'Manrope', sans-serif;
        }

        h1,
        h2,
        .font-display {
            font-family: 'Unbounded', 'Manrope', sans-serif;
            letter-spacing: -0.02em;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(60rem 40rem at 90% -10%, rgba(108, 92, 231, .14), transparent 60%), radial-gradient(50rem 35rem at -10% 45%, rgba(34, 211, 238, .10), transparent 60%);
        }

        ::selection {
            background: var(--violet);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--violet), var(--cyan));
            border-radius: 99px;
        }

        #scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0;
            z-index: 100;
            background: linear-gradient(90deg, #6c5ce7, #22d3ee, #f59e0b);
        }

        .bg-blue-600 {
            background-image: linear-gradient(135deg, #7c6cf5, #2563eb);
            box-shadow: 0 8px 24px -10px rgba(99, 102, 241, .7);
        }

        .bg-blue-600:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        button,
        a {
            transition: transform .2s, filter .2s, background-color .2s, color .2s;
        }

        :focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
        }

        .course-card {
            transition: transform .35s, box-shadow .35s, border-color .35s;
        }

        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 26px 50px -22px rgba(108, 92, 231, .55);
            border-color: rgba(108, 92, 231, .55);
        }

        .hero {
            background: var(--ink);
            --sx: 72%;
            --sy: 30%;
            --mx: 0;
            --my: 0;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(26rem 26rem at var(--sx) var(--sy), rgba(108, 92, 231, .5), transparent 65%);
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .35;
            background-image: linear-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .07) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at 70% 40%, #000, transparent 75%);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .5;
            animation: drift 14s ease-in-out infinite alternate;
        }

        @keyframes drift {
            to {
                transform: translate(50px, -30px) scale(1.15);
            }
        }

        .grad-text {
            background: linear-gradient(90deg, #8b7cf6, #22d3ee, #fbbf24, #8b7cf6);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: sheen 8s linear infinite;
        }

        @keyframes sheen {
            to {
                background-position: 300% 0;
            }
        }

        .rise {
            opacity: 0;
            transform: translateY(20px);
            animation: rise .9s cubic-bezier(.2, .7, .2, 1) forwards;
            animation-delay: var(--d, 0s);
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: none;
            }
        }

        .float-card {
            transition: transform .18s ease-out;
            transform: translate3d(calc(var(--mx) * var(--z) * 1px), calc(var(--my) * var(--z) * 1px), 0) rotate(var(--r));
        }

        .marquee {
            overflow: hidden;
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
        }

        .marquee-track {
            display: flex;
            gap: .75rem;
            width: max-content;
            animation: marquee 32s linear infinite;
        }

        .marquee:hover .marquee-track {
            animation-play-state: paused;
        }

        @keyframes marquee {
            to {
                transform: translateX(-50%);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            .rise {
                opacity: 1;
                transform: none;
            }
        }

        .smooth-scroll {
            scroll-behavior: smooth;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }

        .dark .glass {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
        }

.tinp { width: 100%; border: 1px solid #d5d8e8; border-radius: .6rem; padding: .6rem .8rem; background: #fff; font-size: .9rem; }
.tinp:focus { outline: 2px solid #22d3ee; border-color: transparent; }
.dark .tinp { background: #1f2937; color: #f3f4f6; border-color: #374151; }
.tbtn { border-radius: .6rem; padding: .55rem 1rem; font-weight: 700; font-size: .875rem; transition: filter .2s; }
.tbtn:hover { filter: brightness(1.08); }
.tbp { background: #6c5ce7; color: #fff; }
.tbg { border: 1px solid #d5d8e8; background: #fff; }
.dark .tbg { background: #1f2937; border-color: #374151; color: #f3f4f6; }
.tnavb { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem .8rem; border-radius: .6rem; font-weight: 600; font-size: .9rem; }
.tnavb:hover, .tnavb.on { background: rgba(108, 92, 231, .12); color: #6c5ce7; }

    </style>
</head>

function generateCourses() {
    const savedCourses = localStorage.getItem('eduflow_courses');
    if (savedCourses) return JSON.parse(savedCourses);

    let courses = [];
    let courseTitles = [
        "Full-stack Web Dasturlash (Python & React)",
        "UI/UX Dizayn va Figma asoslari",
        "SMM va Zamonaviy Marketing",
        "Ingliz tili: Beginner'dan IELTS 7.5'gacha",
        "Biznes va Startap asoslari",
        "Mobile App Development: Flutter",
        "Grafik Dizayn: Photoshop va Illustrator",
        "Ispan tili: Noldan so'zlashuv",
        "Finans va Buxgalteriya asoslari",
        "Data Science va Machine Learning Python'da"
    ];

    for (let i = 1; i <= 100; i++) {
        let baseTitle = courseTitles[(i - 1) % courseTitles.length];
        let cat = categories[(i - 1) % categories.length];
        let inst = instructors[(i - 1) % instructors.length];
        courses.push({
            id: i,
            title: `${baseTitle} #${i}`,
            category: cat,
            instructor: inst,
            price: 100000 + (i * 5000),
            rating: (4.5 + (i % 5) * 0.1).toFixed(1),
            reviewsCount: 12 + i * 3,
            lessonsCount: 15 + (i % 20),
            image: courseImageFor({ title: baseTitle, category: cat }),
            description: courseDescriptionFor({ title: baseTitle }),
            liked: false,
            inCart: false
        });
    }
    localStorage.setItem('eduflow_courses', JSON.stringify(courses));
    return courses;
}

function parseRoute() {

    let arg = parts.slice(1).join('/');

    const view = ROUTE_NAMES[parts[0]];
    return { view: view === undefined ? 'home' : view, arg };
}

let myPoints = { key: '', balance: 0, log: [], state: 'off' }, myPointsUnsub = null;
function pointsKey(email) { return encodeURIComponent(String(email || '').trim().toLowerCase()); }
function ensureMyPoints() {
    const key = currentUser && currentUser.email ? pointsKey(currentUser.email) : '';
    if (key === myPoints.key && myPoints.state !== 'off') return;
    if (myPointsUnsub) { myPointsUnsub(); myPointsUnsub = null; }
    myPoints = { key, balance: 0, log: [], state: key && cloudDb ? 'loading' : 'off' };
    if (!key || !cloudDb) { refreshMyPointsUI(); return; }
    myPointsUnsub = cloudDb.collection('points').doc(key).onSnapshot(d => {
        if (myPoints.key !== key) return;
        myPoints.balance = d.exists ? (+d.data().balance || 0) : 0;
        cloudDb.collection('pointLog').where('key', '==', key).get().then(s => {
            if (myPoints.key !== key) return;
            myPoints.log = s.docs.map(x => x.data()).sort((x, y) => (y.createdAt || '').localeCompare(x.createdAt || '')).slice(0, 100);
            myPoints.state = 'ok'; refreshMyPointsUI();
        }).catch(err => { console.warn('Ball tarixi:', err.message); if (myPoints.key === key) { myPoints.state = 'ok'; refreshMyPointsUI(); } });
    }, err => { console.warn('Ballar:', err.message); if (myPoints.key === key) { myPoints.state = 'error'; refreshMyPointsUI(); } });
}

function myPointsStatusHtml() {

function ensureMyOrders() {
    const key = currentUser && currentUser.email ? pointsKey(currentUser.email) : '';
    if (key === myOrdersKey) return;
    if (myOrdersUnsub) { myOrdersUnsub(); myOrdersUnsub = null; }
    myOrdersKey = key; myOrders = [];
    if (!key || !cloudDb) return;
    myOrdersUnsub = cloudDb.collection('shopOrders').where('key', '==', key).onSnapshot(s => {
        if (myOrdersKey !== key) return;
        myOrders = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        if (currentView === 'shop') { renderShopBody(); if (window.applyI18nAll) window.applyI18nAll(); }

}

function shopKey(e) { if (e.key === 'Escape') shopClose(); }
function shopClose() {

    const m = document.getElementById('shop-modal'); if (m) m.remove();

async function shopBuy(e, id) {
    e.preventDefault();
    const it = SHOP_ITEMS.find(x => x.id === id); if (!it || !currentUser || shopBusy) return;
    const err = document.getElementById('shop-err'), go = document.getElementById('shop-go');
    if (!cloudDb) { err.textContent = "Internet aloqasi yo'q."; return; }
    if (shopAvailable() < it.price) { err.textContent = "Ball yetarli emas."; return; }
    shopBusy = true; go.disabled = true; go.classList.add('opacity-60');
    try {
        await cloudDb.collection('shopOrders').add({
            key: pointsKey(currentUser.email), email: currentUser.email.trim(), name: currentUser.name || '',
            itemId: it.id, itemName: it.n[0], price: it.price,
            note: (document.getElementById('shop-note').value || '').trim().slice(0, 120),
            status: 'pending', createdAt: new Date().toISOString()
        });
        shopClose();
        shopToast("Buyurtma yuborildi. Admin topshirganda ball yechiladi.");
    } catch (x) {
        console.warn('Edu-Shop:', x && x.message);
        err.textContent = x && x.code === 'permission-denied' ? "Ruxsat yo'q: Firestore Rules'ni yangilang." : "Buyurtma yuborilmadi. Qayta urinib ko'ring.";
        go.disabled = false; go.classList.remove('opacity-60');
    }
    shopBusy = false;
}
function shopToast(msg) {
    let t = document.getElementById('shop-toast');
    if (!t) { t = document.createElement('div'); t.id = 'shop-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl bg-green-600 text-white text-sm font-semibold shadow-lg';
    t.textContent = msg;
    if (window.applyI18nAll) window.applyI18nAll();
    clearTimeout(t._h); t._h = setTimeout(() => t.remove(), 4000);
}
let cloudState = 'off'; // off | connecting | on | error

function cloudConfigured() {
    return typeof firebase !== 'undefined' && FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('YOUR_');
}

function initCloud() {
    if (!cloudConfigured()) return;
    try {
        firebase.initializeApp(FIREBASE_CONFIG);
        cloudDb = firebase.firestore();
        cloudState = 'connecting';
        cloudDb.collection('users').onSnapshot(snap => {
            const list = [];
            snap.forEach(d => list.push(d.data()));
            cloudState = 'on';
            localStorage.setItem(USERS_KEY, JSON.stringify(list)); // kesh
            mergeCloudPurchases(list);

        }, err => {
            console.error('Firestore xatosi:', err);
            cloudState = 'error';

        });
    } catch (e) {
        console.error('Firebase init xatosi:', e);
        cloudState = 'error';
    }
}

function cloudUpsertUser(user, registeredAt) {
    if (!cloudDb) return;
    // Hujjat ID si birinchi ro'yxatdan o'tgan emaildan olinadi va o'zgarmaydi
    if (!user.cloudId) {
        user.cloudId = encodeURIComponent(user.email.trim().toLowerCase());
        if (currentUser && currentUser.email === user.email) {
            localStorage.setItem('eduflow_current_user', JSON.stringify(user));
        }
    }
    const ref = cloudDb.collection('users').doc(user.cloudId);
    const data = { name: user.name, email: user.email.trim(), isPro: !!user.isPro };
    if (user.proUntil) { data.proPlan = user.proPlan || 'monthly'; data.proUntil = user.proUntil; }
    ref.get().then(doc => {
        if (doc.exists) {
            const d = doc.data();
            if (d.deleted) return; // o'chirilgan akkaunt
            if (d.name === data.name && d.email === data.email && !!d.isPro === data.isPro && (!data.proUntil || d.proUntil === data.proUntil)) return; // o'zgarish yo'q
        } else {
            data.registeredAt = registeredAt || new Date().toISOString();
        }
        return ref.set(data, { merge: true });
    }).catch(err => { console.error('Firestore yozish xatosi:', err); cloudState = 'error'; });
}

function registerUserInRegistry(user, oldEmail) {
    if (!user || user.isAdmin || !user.email) return;
    const list = getUsers();
    const lookup = (oldEmail || user.email).trim().toLowerCase();
    const i = list.findIndex(u => (u.email || '').toLowerCase() === lookup);
    let registeredAt, dirty = false;
    if (i === -1) {
        registeredAt = new Date().toISOString();
        list.push({ name: user.name, email: user.email.trim(), registeredAt, isPro: !!user.isPro, ...(user.proUntil ? { proPlan: user.proPlan || 'monthly', proUntil: user.proUntil } : {}) });
        dirty = true;
    } else {
        registeredAt = list[i].registeredAt;
        if (list[i].name !== user.name || list[i].email !== user.email.trim() || !!list[i].isPro !== !!user.isPro || (user.proUntil && list[i].proUntil !== user.proUntil)) {
            list[i].name = user.name;
            list[i].email = user.email.trim();
            list[i].isPro = !!user.isPro;
            if (user.proUntil) { list[i].proPlan = user.proPlan || 'monthly'; list[i].proUntil = user.proUntil; }
            dirty = true;
        }
    }
    if (dirty) saveUsers(list);
    cloudUpsertUser(user, registeredAt);
}

function fmtDate(v) {
    const d = new Date(v);
    return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
}
function isProActive(u) { return !!(u && u.isPro && (!u.proUntil || new Date(u.proUntil) > new Date())); }
function proStatusText(u) {
    if (!u || !u.isPro || !u.proUntil) return '';
    const left = Math.max(0, Math.ceil((new Date(u.proUntil) - new Date()) / 86400000));
    return `PRO ${fmtDate(u.proUntil)} gacha (${left} kun qoldi)`;
}

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function checkAccountStatus() {

    let missing = false;
    if (currentUser && !currentUser.isAdmin && currentUser.email) {

function initComments() {
    if (!cloudDb) { commentsState = 'off'; return; }
    commentsState = 'loading';
    try {
        if (firebase.auth) {
            firebase.auth().onAuthStateChanged(u => { commentsUid = u ? u.uid : null; refreshCommentsList(); });
            firebase.auth().signInAnonymously().catch(err => console.error('Anonim kirish xatosi:', err));
        }
    } catch (e) { console.error('Auth init xatosi:', e); }
    cloudDb.collection('comments').orderBy('createdAt', 'desc').limit(60).onSnapshot(snap => {
        const list = [];
        snap.forEach(d => list.push({ id: d.id, ...d.data() }));
        commentsCache = list;
        commentsState = 'on';
        refreshCommentsList();
    }, err => {
        console.error('Sharxlar xatosi:', err);
        commentsState = 'error';
        refreshCommentsList();
    });
}

function computeSiteRating() {
    const r = commentsCache.map(m => parseInt(m.rating)).filter(n => n >= 1 && n <= 5);
    const count = r.length;
    const avg = count ? r.reduce((a, b) => a + b, 0) / count : 0;
    return { count, avg };
}

function renderSiteRatingHtml() {
    const t = i18n[currentLang] || i18n.uz;
    if (commentsState === 'off' || commentsState === 'error') return '';
    const { count, avg } = computeSiteRating();
    const pct = Math.round(avg / 5 * 100);
    const star = '<i class="fa-solid fa-star"></i>';
    const stars = star.repeat(5);
    const hasData = commentsState === 'on' && count > 0;
    const sub = commentsState === 'loading' ? '...' : (hasData ? t.siteRatingCount.replace('{n}', count) : t.siteRatingNone);
    return `
                <button type="button" onclick="var s=document.getElementById('comments-section'); if(s) s.scrollIntoView({behavior:'smooth'});"
                    class="group inline-flex flex-wrap items-center gap-x-4 gap-y-2 px-5 py-3 rounded-2xl bg-white/10 border border-white/15 backdrop-blur text-left hover:bg-white/15">
                    <span>

                        <span class="flex items-center gap-2 mt-1">
                            <span class="font-display text-2xl font-extrabold leading-none">${hasData ? avg.toFixed(1) : '&ndash;'}</span>
                            <span class="relative inline-block text-sm leading-none whitespace-nowrap">
                                <span class="text-white/25">${stars}</span>
                                <span class="absolute left-0 top-0 overflow-hidden text-amber-400" style="width:${hasData ? pct : 0}%">${stars}</span>
                            </span>
                        </span>
                    </span>
                    <span class="text-xs text-white/70">${sub}</span>
                </button>`;
}

function deleteComment(id) {
    const c = ct();
    const m = commentsCache.find(x => x.id === id);
    if (!m || !m.uid || m.uid !== commentsUid) return;
    if (!confirm(c.delConfirm)) return;
    cloudDb.collection('comments').doc(id).delete()
        .then(() => commentToast(c.deleted))
        .catch(err => { console.error('Sharx o\'chirish xatosi:', err); alert(c.delErr); });
}

function commentToast(msg) {
    const d = document.createElement('div');
    d.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-gray-900 text-white text-sm font-medium px-5 py-3 rounded-xl shadow-2xl';
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3000);
}

function submitComment(e) {
    e.preventDefault();
    const c = ct();
    const name = document.getElementById('comment-name').value.trim();
    const text = document.getElementById('comment-text').value.trim();
    if (name.length < 2) { alert(c.needName); return; }
    if (text.length < 3) { alert(c.needText); return; }
    if (!cloudDb) { alert(c.off); return; }
    if (!commentsUid) { alert(c.authErr); return; }
    const last = parseInt(localStorage.getItem('eduflow_last_comment_at')) || 0;
    if (Date.now() - last < 30000) { alert(c.wait); return; }
    const btn = document.getElementById('comment-submit-btn');
    btn.disabled = true; btn.classList.add('opacity-60');
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${c.sending}`;
    cloudDb.collection('comments').add({
        name: name.slice(0, 60),
        text: text.slice(0, 500),
        rating: commentRating,
        lang: currentLang,
        uid: commentsUid,
        createdAt: new Date().toISOString()
    }).then(() => {
        localStorage.setItem('eduflow_last_comment_at', String(Date.now()));
        closeCommentModal();
        commentToast(c.thanks);
    }).catch(err => {
        console.error('Sharx yozish xatosi:', err);
        btn.disabled = false; btn.classList.remove('opacity-60');
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> ${c.send}`;
        alert(c.sendErr);
    });
}

// Firestore teacherCourses (status 'approved') katalogga qo'shiladi. ID raqamli: 1 000 000 dan katta.
const TC_MIN_ID = 1000000;
let tcLoaded = false, tcSel = 0;
function tcIdFor(docId) {
    let h = 5381;
    for (const ch of String(docId)) h = ((h * 33) ^ ch.charCodeAt(0)) >>> 0;
    return TC_MIN_ID + (h % 899000000);
}
const isTeacherCourse = c => !!(c && c.teacher);
function tcToCourse(id, d) {
    const lessons = (d.lessons || []).filter(l => l && l.title);
    const c = {
        id: tcIdFor(id), docId: id, teacher: true,
        title: String(d.title || ''), category: categories.includes(d.category) ? d.category : categories[0],
        level: d.level || '', instructor: d.ownerName || '', price: Math.max(0, Math.round(+d.price || 0)),
        rating: null, reviewsCount: 0, lessons, lessonsCount: lessons.length,
        description: String(d.description || ''), liked: false, inCart: false
    };
    c.image = /^(https?:|data:image\/)/i.test(d.image || '') ? d.image : courseImageFor({ title: c.title, category: c.category });
    return c;
}
function startTeacherCourses() {
    if (!cloudDb) { tcLoaded = true; return; }
    cloudDb.collection('teacherCourses').where('status', '==', 'approved').onSnapshot(snap => {
        const list = snap.docs.map(d => tcToCourse(d.id, d.data())).sort((a, b) => a.title.localeCompare(b.title));
        coursesList = coursesList.filter(c => !isTeacherCourse(c)).concat(list);
        // savatdagi ustoz kurslarini yangilash (narx o'zgargan yoki kurs olib tashlangan bo'lsa)
        const byId = new Map(list.map(c => [c.id, c]));
        const before = cart.length;
        cart = cart.filter(it => !isTeacherCourse(it) || byId.has(it.id)).map(it => isTeacherCourse(it) ? byId.get(it.id) : it);
        if (cart.length !== before || cart.some(isTeacherCourse)) { localStorage.setItem('eduflow_cart', JSON.stringify(cart)); updateCartAndBookmarkCounts(); }
        tcLoaded = true;
        if (['home', 'catalog', 'details', 'tasks', 'profile'].includes(currentView)) {
            renderView(currentView, currentView === 'details' ? selectedCourseId : null);
            if (window.applyI18nAll) window.applyI18nAll();
        }
    }, err => { console.warn('Ustoz kurslari:', err.message); tcLoaded = true; });
}

function tcCanWatch(course, i) { return i === 0 || isPurchased(course.id); }
function tcVideoBlock(course) {
    const L = course.lessons, l = L[tcSel];
    if (!l) return '';
    if (!tcCanWatch(course, tcSel)) return `<div class="aspect-video w-full rounded-3xl bg-gradient-to-br from-gray-800 to-gray-900 flex flex-col items-center justify-center gap-4 text-white text-center p-6">
            <i class="fa-solid fa-lock text-5xl text-white/70"></i>
            <p class="font-semibold">Bu dars kursni sotib olgandan keyin ochiladi.</p>
            <button onclick="addToCart(${course.id})" class="px-5 py-2.5 bg-white text-blue-700 font-bold rounded-xl">Savatchaga Qo'shish</button></div>`;
    const v = renderCourseVideo({ videoUrl: l.video });
    return v || `<div class="aspect-video w-full rounded-3xl bg-gray-800 flex items-center justify-center text-white/70 text-sm p-6 text-center">Bu dars uchun video havolasi noto'g'ri.</div>`;
}
function tcSelect(i) {
    tcSel = i;
    const course = coursesList.find(c => c.id === selectedCourseId);
    if (!course) return;
    const box = document.getElementById('tc-video'); if (box) box.innerHTML = tcVideoBlock(course);
    const list = document.getElementById('tc-lessons'); if (list) list.innerHTML = tcLessonsHtml(course);
    initCourseVideoPlayer();
    if (window.applyI18nAll) window.applyI18nAll();
}
function tcLessonsHtml(course) {

function initHeroFX() {
    const hero = document.getElementById('hero');
    if (!hero || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    hero.addEventListener('mousemove', e => {
        const r = hero.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        hero.style.setProperty('--sx', x + 'px');
        hero.style.setProperty('--sy', y + 'px');
        hero.style.setProperty('--mx', ((x / r.width - 0.5) * 2).toFixed(3));
        hero.style.setProperty('--my', ((y / r.height - 0.5) * 2).toFixed(3));
    });
    hero.addEventListener('mouseleave', () => { hero.style.setProperty('--mx', 0); hero.style.setProperty('--my', 0); });
}

function animateCounters() {
    const run = el => {
        const end = +el.dataset.count, suf = el.dataset.suffix || '', t0 = performance.now();
        const step = t => {
            const p = Math.min((t - t0) / 1400, 1), e = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(end * e).toLocaleString('en-US') + suf;
            if (p < 1 && document.body.contains(el)) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    };
    const io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting) { run(en.target); io.unobserve(en.target); } }), { threshold: 0.4 });
    document.querySelectorAll('[data-count]').forEach(el => io.observe(el));
}

    const bar = document.getElementById('scroll-progress');
    if (!bar) return;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? window.scrollY / h * 100 : 0) + '%';
}, { passive: true });

function renderView(view, param = null) {
    currentView = view;
    const content = document.getElementById('app-content');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    if (view === 'home') renderHome(content);
    else if (view === 'catalog') renderCatalog(content);
    else if (view === 'pricing') renderPricingPage(content);
    else if (view === 'details') {
        selectedCourseId = param || 1;
        renderDetails(content, selectedCourseId);
    }
    else if (view === 'profile') renderProfile(content);
    else if (view === 'tasks') renderTasks(content);
    else if (view === 'contact') renderContact(content);
    else if (view === 'payment') renderPaymentPage(content);
    else if (view === 'shop') renderShop(content);

}

function pageUrl(view, param = null) { return '#/' + routeString(view, param); }

function navigateTo(view, param = null) {
    const same = view === PAGE_VIEW && (view !== 'details' || String(param || 1) === String(selectedCourseId));
    if (same) { renderView(view, param); return; }
    location.hash = pageUrl(view, param);
}

function applyRoute() {
    const r = parseRoute();
    PAGE_VIEW = r.view; currentView = r.view;
    {
        renderView(r.view, r.view === 'details' ? (parseInt(r.arg) || 1) : null);
        if (r.view === 'catalog' && r.arg && categories.includes(r.arg)) {
            const sel = document.getElementById('category-filter');
            if (sel) { sel.value = r.arg; filterCourses(); }
        }
    }
    if (window.applyI18nAll) window.applyI18nAll();
}
window.addEventListener('hashchange', applyRoute);

// ===== KURS VIDEOSI (AI video havolasi) =====
function parseCourseVideo(url) {
    if (!url) return null;
    let u;
    try { u = new URL(String(url).trim()); } catch (e) { return null; }
    if (!/^https?:$/.test(u.protocol)) return null;
    const h = u.hostname.replace(/^www\./, '');
    let id = null;
    if (h === 'youtu.be') id = u.pathname.slice(1);
    else if (h.endsWith('youtube.com')) {
        if (u.pathname === '/watch') id = u.searchParams.get('v');
        else { const m = u.pathname.match(/^\/(embed|shorts|live)\/([\w-]+)/); if (m) id = m[2]; }
    }
    if (id && /^[\w-]{6,15}$/.test(id)) return { type: 'youtube', src: 'https://www.youtube.com/embed/' + id };
    if (/\.(mp4|webm|ogg|mov)$/i.test(u.pathname)) return { type: 'file', src: u.href };
    return { type: 'link', src: u.href };
}

function cvShowScene(i) {
    cvScene = i;
    document.querySelectorAll('#cv-player .cv-scene').forEach((el, idx) => {
        const on = idx === i;
        el.classList.toggle('opacity-100', on);
        el.classList.toggle('translate-y-0', on);
        el.classList.toggle('opacity-0', !on);
        el.classList.toggle('translate-y-4', !on);
    });
}

function cvUpdateUI() {
    const total = cvCount * CV_SCENE_MS;
    const icon = document.querySelector('#cv-toggle i');
    if (icon) icon.className = 'fa-solid ' + (cvPlaying ? 'fa-pause' : (cvElapsed >= total ? 'fa-rotate-right' : 'fa-play'));
    const bar = document.getElementById('cv-bar');
    if (bar) bar.style.width = (cvElapsed / total * 100) + '%';
    const fmt = ms => { const sec = Math.round(ms / 1000); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
    const tm = document.getElementById('cv-time');
    if (tm) tm.textContent = fmt(cvElapsed) + ' / ' + fmt(total);
}

function cvStop() { if (cvTimer) clearInterval(cvTimer); cvTimer = null; cvPlaying = false; }

function cvTick() {
    if (!document.getElementById('cv-player')) { cvStop(); return; }
    const total = cvCount * CV_SCENE_MS;
    cvElapsed = Math.min(cvElapsed + 100, total);
    const idx = Math.min(Math.floor(cvElapsed / CV_SCENE_MS), cvCount - 1);
    if (idx !== cvScene) cvShowScene(idx);
    if (cvElapsed >= total) cvStop();
    cvUpdateUI();
}

function toggleCourseVideo() {
    if (!document.getElementById('cv-player')) return;
    if (cvPlaying) { cvStop(); }
    else {
        if (cvElapsed >= cvCount * CV_SCENE_MS) { cvElapsed = 0; cvShowScene(0); }
        cvPlaying = true;
        cvTimer = setInterval(cvTick, 100);
    }
    cvUpdateUI();
}

function initCourseVideoPlayer() {
    cvStop();
    cvElapsed = 0;
    if (!document.getElementById('cv-player')) return;
    cvShowScene(0);
    cvUpdateUI();
}

function renderCourseVideo(course) {
    const v = parseCourseVideo(course.videoUrl);

function toggleFS(id) {
    const el = document.getElementById(id); if (!el) return;
    const cur = document.fullscreenElement || document.webkitFullscreenElement;
    if (cur) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el);
}
function fsIconSync() {
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const i = document.querySelector('#lp-fs i');
    if (i) i.className = 'fa-solid ' + (on ? 'fa-compress' : 'fa-expand');
}
document.addEventListener('fullscreenchange', fsIconSync);

function lessonTopic(c) {
    const t = String(c.title || '');
    if (/ingliz|english/i.test(t)) return 'english';
    if (/ispan|spanish/i.test(t)) return 'spanish';
    if (/data science|machine/i.test(t)) return 'data';
    if (/flutter|mobile/i.test(t)) return 'mobile';
    if (/full-?stack|python|react|web/i.test(t)) return 'programming';
    if (/ui\/ux|figma/i.test(t)) return 'uiux';
    if (/grafik|photoshop|illustrator/i.test(t)) return 'graphic';
    if (/smm|marketing/i.test(t)) return 'smm';
    if (/finans|buxgalter/i.test(t)) return 'finance';
    return 'business';
}
function buildLessons(course) {
    const tp = lessonTopic(course);
    if (tp === 'english' || tp === 'spanish') {
        const L = tp === 'english' ? { v: EN_VOCAB, g: EN_GRAM, lang: 'en-US' } : { v: ES_VOCAB, g: ES_GRAM, lang: 'es-ES' };
        const out = [], n = Math.max(L.v.length, L.g.length);
        for (let i = 0; i < n; i++) {
            if (L.v[i]) out.push({ type: 'vocab', title: "Yangi so'zlar: " + L.v[i][0], data: L.v[i][1], lang: L.lang });
            if (L.g[i]) out.push({ type: 'rule', title: "Qoida: " + L.g[i].t, data: L.g[i], lang: L.lang });
        }
        return out;
    }
    return (OUTLINES[tp] || OUTLINES.business).map(o => ({ type: 'outline', title: o[0], data: o[1] }));
}

        S.push({ h: cap(lpLab(['Takrorlash', 'Review', 'Повторение'])) + `<ul class="space-y-2 text-left text-sm sm:text-xl font-semibold">${l.data.map(p => `<li class="flex gap-3"><i class="fa-solid fa-circle-check mt-1 text-green-300"></i><span>${E(p)}</span></li>`).join('')}</ul>` });
    }
    return S;
}

function lpStop() {
    if (lp.timer) clearInterval(lp.timer);
    lp.timer = null; lp.playing = false;
    try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { }
}
function lpLocked(i) { return i > 0 && !(lp.course && (isPurchased(lp.course.id) || isProActive(currentUser))); }
function lpSpeak(text) {
    const l = lp.lessons[lp.i];
    if (!l || !l.lang || !window.speechSynthesis || !text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = l.lang; u.rate = 0.85;
    speechSynthesis.speak(u);
}
function lpSay(text) { try { speechSynthesis.cancel(); } catch (e) { } lpSpeak(text); }
function lpSpeakScene() {
    try { speechSynthesis.cancel(); } catch (e) { }
    const sc = lp.scenes && lp.scenes[lp.s];
    if (lp.voice && sc && sc.say) sc.say.forEach(t => lpSpeak(t));
}
function lpInit(course) {
    lpStop();
    if (!document.getElementById('lp-stage')) return;
    lp.course = course; lp.lessons = buildLessons(course); lp.voice = true;
    lp.lens = lp.lessons.map((l, i) => lessonScenes(l, i).length);
    lpOpen(0, false);
}
function lpOpen(i, play) {
    lpStop();
    lp.i = i; lp.s = 0; lp.el = 0;
    lp.scenes = lpLocked(i) ? null : lessonScenes(lp.lessons[i], i);
    lpRender(); lpRenderList();
    if (play && lp.scenes) lpToggle();
}
function lpBar() {
    const bar = document.getElementById('lp-bar');
    if (bar && lp.scenes) bar.style.width = ((lp.s + lp.el / LP_SCENE_MS) / lp.scenes.length * 100) + '%';
}
function lpRender() {
    const st = document.getElementById('lp-scene'); if (!st) return;
    const U = LP_UI[currentLang] || LP_UI.uz;
    document.getElementById('lp-stage').className = 'relative aspect-video w-full rounded-3xl overflow-hidden shadow-lg text-white select-none bg-gradient-to-br ' + TOPIC_GRAD[lessonTopic(lp.course)];
    const ctl = document.getElementById('lp-ctl');
    if (!lp.scenes) {
        ctl.classList.add('hidden');
        st.innerHTML = `<i class="fa-solid fa-lock text-4xl mb-3"></i><p class="text-sm sm:text-lg font-semibold max-w-md mb-4">${U.lockT}</p>
                    <div class="flex flex-wrap gap-2 justify-center"><button onclick="addToCart(${lp.course.id})" class="px-5 py-2 bg-white text-blue-700 font-bold rounded-xl text-sm">${U.add}</button><button onclick="navigateTo('pricing')" class="px-5 py-2 bg-amber-400 text-gray-900 font-bold rounded-xl text-sm"><i class="fa-solid fa-crown"></i> PRO</button></div>`;
        return;
    }
    ctl.classList.remove('hidden');
    st.innerHTML = lp.scenes[lp.s].h;
    const L = lp.lessons[lp.i];
    document.getElementById('lp-voice').classList.toggle('hidden', !L.lang);
    document.getElementById('lp-voice').style.opacity = lp.voice ? 1 : 0.4;
    document.getElementById('lp-count').textContent = `${U.scene} ${lp.s + 1}/${lp.scenes.length}`;
    lpIcon(); lpBar();
}
function lpIcon() {
    const ic = document.querySelector('#lp-toggle i');
    const end = lp.scenes && lp.s >= lp.scenes.length - 1 && lp.el >= LP_SCENE_MS;
    if (ic) ic.className = 'fa-solid ' + (lp.playing ? 'fa-pause' : (end ? 'fa-rotate-right' : 'fa-play'));
}
function lpRenderList() {
    const box = document.getElementById('lp-list'); if (!box) return;
    const U = LP_UI[currentLang] || LP_UI.uz;
    box.innerHTML = lp.lessons.map((l, i) => {
        const locked = lpLocked(i), sec = Math.round(lp.lens[i] * LP_SCENE_MS / 1000);
        const tm = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
        const act = i === lp.i;
        return `<button onclick="lpOpen(${i}, true)" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left text-sm transition ${act ? 'bg-blue-600 text-white' : 'bg-gray-50 dark:bg-gray-700/50 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200'}">
                    <span class="w-6 text-xs font-bold opacity-70">${i + 1}</span>
                    <span class="flex-1 min-w-0 truncate font-semibold">${escapeHtml(l.title)}</span>
                    ${i === 0 && locked === false && !isPurchased(lp.course.id) && !isProActive(currentUser) ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-green-100 text-green-700">${U.free}</span>` : ''}
                    <span class="text-xs opacity-70">${tm}</span>
                    <i class="fa-solid ${locked ? 'fa-lock opacity-60' : 'fa-circle-play'} text-xs"></i></button>`;
    }).join('');
}
function lpTick() {
    if (!document.getElementById('lp-stage') || !lp.scenes) { lpStop(); return; }
    lp.el += 100;
    if (lp.el >= LP_SCENE_MS) {
        if (lp.s >= lp.scenes.length - 1) { lp.el = LP_SCENE_MS; lpStop(); lpIcon(); lpBar(); return; }
        lp.s++; lp.el = 0; lpRender(); lpSpeakScene(); return;
    }
    lpBar();
}
function lpToggle() {
    if (!lp.scenes) return;
    if (lp.playing) { lpStop(); lpIcon(); return; }
    if (lp.s >= lp.scenes.length - 1 && lp.el >= LP_SCENE_MS) { lp.s = 0; lp.el = 0; lpRender(); }
    lp.playing = true; lpIcon(); lpSpeakScene();
    lp.timer = setInterval(lpTick, 100);
}
function lpStep(d) {
    if (!lp.scenes) return;
    lp.s = Math.max(0, Math.min(lp.scenes.length - 1, lp.s + d)); lp.el = 0;
    lpRender(); if (lp.playing) lpSpeakScene();
}
function lpVoice() { lp.voice = !lp.voice; if (!lp.voice) { try { speechSynthesis.cancel(); } catch (e) { } } else if (lp.playing) lpSpeakScene(); lpRender(); }

function purchasesKey() { return currentUser && currentUser.email ? 'eduflow_purchases_' + currentUser.email.trim().toLowerCase() : null; }
function getPurchases() { // [{id, at}]
    const k = purchasesKey(); if (!k) return [];
    try { const a = JSON.parse(localStorage.getItem(k)); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function savePurchases(list) {
    const k = purchasesKey(); if (!k) return;
    localStorage.setItem(k, JSON.stringify(list));
    if (!cloudDb) return;
    const id = currentUser.cloudId || encodeURIComponent(currentUser.email.trim().toLowerCase());
    // update() hujjat mavjud bo'lmasa xato beradi, shuning uchun bo'sh "ruh" foydalanuvchi yaratilmaydi
    cloudDb.collection('users').doc(id).update({ purchases: list }).catch(err => console.warn('Sotib olinganlarni bulutga yozib bo\'lmadi:', err.message));
}
function mergeCloudPurchases(cloudUsers) {
    if (!currentUser || !currentUser.email) return;
    const me = cloudUsers.find(u => (u.email || '').trim().toLowerCase() === currentUser.email.trim().toLowerCase());
    if (!me || !Array.isArray(me.purchases)) return;
    const local = getPurchases(), have = new Set(local.map(p => p.id));
    let changed = false;
    me.purchases.forEach(p => { if (p && !have.has(p.id)) { local.push(p); changed = true; } });
    if (changed) localStorage.setItem(purchasesKey(), JSON.stringify(local));
}
function isPurchased(id) { return getPurchases().some(p => p.id === id); }
function doneKey() { return 'eduflow_tasks_done_' + currentUser.email.trim().toLowerCase(); }
function getDoneMap() { try { return JSON.parse(localStorage.getItem(doneKey())) || {}; } catch (e) { return {}; } }
function toggleTaskDone(courseId, idx) {
    const m = getDoneMap(), k = courseId + '-' + idx;
    if (m[k]) delete m[k]; else m[k] = new Date().toISOString();
    localStorage.setItem(doneKey(), JSON.stringify(m));
    navigateTo('tasks');
}

function renderTasks(container) {

                    </div>`;
        return;
    }
    const purchases = getPurchases().filter(p => coursesList.some(c => c.id === p.id));
    if (purchases.length === 0) {
        container.innerHTML = `
                    <div class="py-12 max-w-4xl mx-auto space-y-6">
                        <h1 class="text-3xl font-bold text-gray-900 dark:text-white flex items-center gap-2"><i class="fa-solid fa-list-check text-blue-600"></i> ${U.title}</h1>
                        <div class="bg-white dark:bg-gray-800 p-10 rounded-2xl border border-gray-200 dark:border-gray-700 text-center">

                            <p class="text-sm text-gray-500 mb-5">${U.emptyDesc}</p>
                            <button onclick="navigateTo('catalog')" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition">${U.toCatalog}</button>
                        </div>
                    </div>`;
        return;
    }
    const doneMap = getDoneMap(), now = new Date();
    const blocks = purchases.slice().reverse().map(p => {
        const course = coursesList.find(c => c.id === p.id);
        const tasks = tasksForCourse(course);
        const doneCount = tasks.filter((_, i) => doneMap[p.id + '-' + i]).length;
        const rows = tasks.map((t, i) => {
            const isDone = !!doneMap[p.id + '-' + i];
            const due = new Date(new Date(p.at).getTime() + (i + 1) * 7 * 86400000);
            const days = Math.ceil((due - now) / 86400000);
            let badge, dueText;
            if (isDone) { badge = `<span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">${U.done}</span>`; dueText = ''; }
            else if (days < 0) { badge = `<span class="px-3 py-1 bg-red-100 text-red-700 text-xs font-bold rounded-full">${U.overdue}</span>`; dueText = `${U.due}: ${fmtDate(due)}`; }
            else { badge = `<span class="px-3 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full">${U.pending}</span>`; dueText = `${U.due}: ${fmtDate(due)} · ` + (days === 0 ? U.todayDue : `${days} ${U.left}`); }
            return `
                        <div class="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div class="min-w-0">
                                <h4 class="font-bold text-gray-900 dark:text-white ${isDone ? 'line-through opacity-60' : ''}">${U.task} #${i + 1}: ${escapeHtml(t.title)}</h4>
                                <p class="text-sm text-gray-600 dark:text-gray-300 mt-0.5">${escapeHtml(t.desc)}</p>
                                ${dueText ? `<p class="text-xs text-gray-500 mt-1">${dueText}</p>` : ''}
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                ${badge}
                                <button onclick="toggleTaskDone(${p.id}, ${i})" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-blue-600 hover:text-white hover:border-blue-600 transition">${isDone ? U.undo : U.markDone}</button>
                            </div>
                        </div>`;
        }).join('');
        return `
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-200 dark:border-gray-700 space-y-4">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <h3 class="text-lg font-bold text-gray-900 dark:text-white">${escapeHtml(course.title)}</h3>
                                <p class="text-xs text-gray-500">${U.bought}: ${fmtDate(p.at)}</p>
                                <button onclick="navigateTo('details', ${p.id})" class="text-xs font-semibold text-blue-600 hover:underline mt-1"><i class="fa-solid fa-circle-play"></i> ${U.watch}</button>
                            </div>
                            <span class="text-xs font-bold px-3 py-1 rounded-full bg-blue-100 text-blue-700">${doneCount}/${tasks.length} ${U.progress}</span>
                        </div>
                        <div class="space-y-3">${rows}</div>
                    </div>`;
    }).join('');
    container.innerHTML = `
                <div class="py-12 max-w-4xl mx-auto space-y-6">
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white flex items-center gap-2"><i class="fa-solid fa-list-check text-blue-600"></i> ${U.title}</h1>
                    ${blocks}

}

// BOOKMARKS & CART ACTIONS
function toggleBookmark(id) {
    if (bookmarks.includes(id)) {
        bookmarks = bookmarks.filter(bId => bId !== id);
    } else {
        bookmarks.push(id);
    }
    localStorage.setItem('eduflow_bookmarks', JSON.stringify(bookmarks));
    updateCartAndBookmarkCounts();
    navigateTo(currentView, selectedCourseId);
}

function addToCart(id) {
    const course = coursesList.find(c => c.id === id);
    if (!course) return;

    if (!cart.some(item => item.id === id)) {
        cart.push(course);
        localStorage.setItem('eduflow_cart', JSON.stringify(cart));
        updateCartAndBookmarkCounts();
        navigateTo(currentView, selectedCourseId);
    } else {
        openCartModal();
    }
}

function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    localStorage.setItem('eduflow_cart', JSON.stringify(cart));
    updateCartAndBookmarkCounts();
    renderCartModalItems();
    navigateTo(currentView, selectedCourseId);
}

function updateCartAndBookmarkCounts() {
    document.getElementById('bookmark-count').innerText = bookmarks.length;
    document.getElementById('cart-count').innerText = cart.length;
}

function setPending(list) { localStorage.setItem(PENDING_KEY, JSON.stringify(list)); }

function payToast(msg) {

async function fetchOrder(id) {
    const r = await fetch('/api/order-status?id=' + encodeURIComponent(id) + '&email=' + encodeURIComponent(myEmail()), { cache: 'no-store' });
    if (r.status === 404) return { status: 'not_found' };
    if (!r.ok) throw new Error('status ' + r.status);
    return r.json();
}

// To'langan buyurtmadagi kurslarni foydalanuvchiga biriktirish (server aytgan ro'yxat bo'yicha)
function grantPaidOrder(order) {
    const purchases = getPurchases(), have = new Set(purchases.map(x => x.id)), at = new Date().toISOString();
    order.items.forEach(id => { if (!have.has(id)) purchases.push({ id, at }); });
    savePurchases(purchases);
    setPending(getPending().filter(x => x.orderId !== order.orderId));
    cart = cart.filter(c => !order.items.includes(c.id));
    localStorage.setItem('eduflow_cart', JSON.stringify(cart));
    updateCartAndBookmarkCounts();
}

// Har bir sahifa ochilganda: avval boshlangan, lekin hali biriktirilmagan to'lovlarni tekshiradi
async function checkPendingOrders() {
    if (!currentUser) return;
    const mine = getPending().filter(p => p.email === myEmail());
    let granted = 0;
    for (const p of mine) {
        try {
            const o = await fetchOrder(p.orderId);
            if (o.status === 'paid' && o.owner) { grantPaidOrder(o); granted++; }
            else if (o.status === 'not_found' || o.status === 'cancelled' || Date.now() - p.at > 3 * 24 * 3600 * 1000) setPending(getPending().filter(x => x.orderId !== p.orderId));
        } catch (e) { /* server vaqtincha ishlamasa, keyingi safar urinib ko'riladi */ }
    }
    if (granted) { payToast(payT().toast); if (['catalog', 'details', 'profile', 'tasks', 'home'].includes(PAGE_VIEW)) renderView(PAGE_VIEW, PAGE_VIEW === 'details' ? selectedCourseId : null); }
}

async function startPayment(provider) {
    const c = payT();
    if (!cart.length || !currentUser) return;
    const m = document.getElementById('pay-modal');
    const uzumName = (m && m.dataset.uzumName) || 'EduFlow';
    m.querySelectorAll('.pay-opt').forEach(b => { b.disabled = true; b.classList.add('opacity-60'); });
    const err = document.getElementById('pay-error'); if (err) err.classList.add('hidden');
    const ids = cart.map(i => i.id);
    try {
        const r = await fetch('/api/create-order', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: ids, email: myEmail(), provider, lang: currentLang })
        });
        const j = await r.json();
        if (!r.ok || !j.orderId) throw new Error(j.error || 'create_failed');
        const pend = getPending().filter(x => x.orderId !== j.orderId);
        pend.push({ orderId: j.orderId, items: ids, email: myEmail(), at: Date.now() });
        setPending(pend);
        if (j.payUrl) {
            if (err) { err.textContent = c.redirecting; err.classList.remove('hidden', 'text-red-600', 'dark:text-red-400'); err.classList.add('text-gray-500'); }
            location.href = j.payUrl; // to'lov tizimining o'z sahifasi
            return;
        }
        showUzumInstructions(j, uzumName);
    } catch (e) {
        console.error('To\'lov boshlanmadi:', e);
        m.querySelectorAll('.pay-opt').forEach(b => { b.disabled = false; b.classList.remove('opacity-60'); });
        if (err) { err.textContent = c.errCreate; err.classList.remove('hidden'); }
    }
}

function cardBrand(num) {
    if (/^4/.test(num)) return 'VISA';
    if (/^(5[1-5]|2[2-7])/.test(num)) return 'Mastercard';
    if (/^8600/.test(num)) return 'UzCard';
    if (/^9860/.test(num)) return 'Humo';
    return '';
}

function formatCardNumber(el) {
    const digits = el.value.replace(/\D/g, '').slice(0, 19);
    el.value = digits.replace(/(.{4})/g, '$1 ').trim();
    const b = document.getElementById('card-brand');
    if (b) b.textContent = cardBrand(digits);
}

function formatCardExp(el) {
    let d = el.value.replace(/\D/g, '').slice(0, 4);
    if (d.length >= 3) d = d.slice(0, 2) + '/' + d.slice(2);
    el.value = d;
}

function luhnOk(num) {
    let sum = 0, alt = false;
    for (let i = num.length - 1; i >= 0; i--) {
        let n = parseInt(num[i], 10);
        if (alt) { n *= 2; if (n > 9) n -= 9; }
        sum += n; alt = !alt;
    }
    return sum % 10 === 0;
}

function cardError(msg) {
    const e = document.getElementById('card-error');
    if (e) { e.textContent = msg; e.classList.remove('hidden'); }
}

function submitCardPayment(e) {
    e.preventDefault();
    const c = cardT();
    const num = document.getElementById('card-number').value.replace(/\s/g, '');
    const name = document.getElementById('card-name').value.trim();
    const exp = document.getElementById('card-exp').value.trim();
    const cvv = document.getElementById('card-cvv').value.trim();
    if (!/^\d{13,19}$/.test(num) || !luhnOk(num)) return cardError(c.errNumber);
    if (name.length < 3) return cardError(c.errName);
    const mm = /^(\d{2})\/(\d{2})$/.exec(exp);
    const month = mm ? parseInt(mm[1], 10) : 0, year = mm ? 2000 + parseInt(mm[2], 10) : 0;
    // karta oyning oxirigacha amal qiladi
    if (!mm || month < 1 || month > 12 || new Date(year, month, 1) <= new Date()) return cardError(c.errExp);
    if (!/^\d{3,4}$/.test(cvv)) return cardError(c.errCvv);
    const btn = document.getElementById('card-pay-btn');
    btn.disabled = true; btn.classList.add('opacity-60');
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${c.paying}`;
    // Demo: haqiqiy to'lov tizimiga so'rov yuborilmaydi, qisqa kutishdan so'ng to'lov "muvaffaqiyatli" bo'ladi.
    setTimeout(() => { closeCardModal(); completeCheckout(); }, 1200);
}

const proPlanTexts = {

    en: { m: "1 month \u2014 30,000 UZS", y: "1 year \u2014 360,000 UZS", yr: "or 360,000 UZS / year" },

function addMonths(date, n) {
    const d = new Date(date), day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    return d;
}

function persistCurrentUser() { localStorage.setItem('eduflow_current_user', JSON.stringify(currentUser)); }

function enforceProExpiry() {
    if (!currentUser || currentUser.isAdmin || !currentUser.isPro) return;
    if (!currentUser.proUntil) {
        currentUser.proPlan = 'monthly';
        currentUser.proUntil = addMonths(new Date(), 1).toISOString();
        persistCurrentUser();
        registerUserInRegistry(currentUser);
        return;
    }
    if (new Date(currentUser.proUntil) <= new Date()) {
        currentUser.isPro = false;
        persistCurrentUser();
        registerUserInRegistry(currentUser);
        updateHeaderAuthUI();
        alert("PRO obunangiz muddati tugadi. Yangilash uchun \"PRO Tariflar\" bo'limiga o'ting.");

const EMAIL_CONFIG = { serviceId: 'service_ck5z5f6', templateId: 'template_v045sef', publicKey: 'L6ugd2WcQeA0Qv-FZ' };
const CODE_TTL_MS = 10 * 60 * 1000, CODE_COOLDOWN_S = 60, CODE_MAX_TRIES = 5;
let authCode = null;          // { email, codes[], expires, tries }
let codeCooldownTimer = null;
let lastMailError = '';

function resetAuthCode() {
    authCode = null;

}
function startCodeCooldown() {
    const btn = document.getElementById('auth-send-code-btn');
    let sec = CODE_COOLDOWN_S;
    clearInterval(codeCooldownTimer);
    const tick = () => {
        if (sec <= 0) { clearInterval(codeCooldownTimer); btn.disabled = false; btn.textContent = 'Qayta yuborish'; return; }
        btn.disabled = true; btn.textContent = `Qayta yuborish (${sec} s)`; sec--;
    };

}
async function deliverAuthCode(email, name, code) {
    const c = EMAIL_CONFIG;
    if (!c.serviceId || !c.templateId || !c.publicKey) return 'test';
    try {
        const r = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                service_id: c.serviceId, template_id: c.templateId, user_id: c.publicKey,
                template_params: {
                    to_email: email, user_name: name, app_name: 'EduFlow', minutes: 10,
                    code: code, passcode: code,
                    time: (() => { const d = new Date(Date.now() + CODE_TTL_MS), z = n => String(n).padStart(2, '0'); return `${z(d.getDate())}.${z(d.getMonth() + 1)}.${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`; })()
                }
            })
        });
        if (r.ok) return 'sent';
        lastMailError = `${r.status} ${(await r.text()).slice(0, 160)}`.trim();
        console.error('EmailJS xatosi:', lastMailError);
        return 'failed';
    } catch (err) { lastMailError = String(err && err.message || err).slice(0, 160); console.error('EmailJS xatosi:', err); return 'failed'; }
}
async function sendAuthCode() {
    const emailEl = document.getElementById('auth-email');
    const email = emailEl.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { alert("Email manzilini to'g'ri kiriting."); emailEl.focus(); return; }
    const key = email.toLowerCase();
    const existing = getUsers().find(u => !u.deleted && (u.email || '').toLowerCase() === key);
    if (authMode === 'register' && existing) { alert("Bu email bilan akkaunt allaqachon mavjud. Iltimos, tizimga kiring."); return; }
    if (authMode === 'login' && !existing) { alert("Bunday akkaunt topilmadi. Avval \"Akkaunt yaratish\" tugmasi orqali ro'yxatdan o'ting."); return; }
    const btn = document.getElementById('auth-send-code-btn');
    btn.disabled = true;
    const code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 900000 + 100000);
    const name = authMode === 'register' ? document.getElementById('auth-name').value.trim() : existing.name;
    const status = await deliverAuthCode(email, name, code);
    if (status === 'failed') { alert("Kod yuborilmadi. Birozdan so'ng qayta urinib ko'ring." + (lastMailError ? ` (${lastMailError})` : '')); btn.disabled = false; return; }
    const same = authCode && authCode.email === key && Date.now() < authCode.expires;
    authCode = { email: key, codes: [code, ...(same ? authCode.codes : [])].slice(0, 3), expires: Date.now() + CODE_TTL_MS, tries: same ? authCode.tries : 0 };
    document.getElementById('auth-code-wrap').classList.remove('hidden');
    const inp = document.getElementById('auth-code'); inp.value = ''; inp.required = true; inp.focus();
    document.getElementById('auth-code-hint').textContent = status === 'sent'
        ? `Kod ${email} manziliga yuborildi. 10 daqiqa amal qiladi.`
        : `Test rejimi: email xizmati ulanmagan. Kod: ${code}`;
    startCodeCooldown();
}

function handleAuthSubmit(e) {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const key = email.toLowerCase();
    const existing = getUsers().find(u => !u.deleted && (u.email || '').toLowerCase() === key);

    if (!authCode || authCode.email !== key) { alert("Avval emailga kod yuboring."); return; }
    if (Date.now() > authCode.expires) { resetAuthCode(); alert("Kod muddati tugadi. Yangi kod so'rang."); return; }
    if (!authCode.codes.includes(document.getElementById('auth-code').value.replace(/\D/g, ''))) {
        authCode.tries++;
        if (authCode.tries >= CODE_MAX_TRIES) { resetAuthCode(); alert("Urinishlar soni tugadi. Yangi kod so'rang."); }
        else alert("Kod noto'g'ri. Qaytadan urinib ko'ring.");
        return;
    }
    resetAuthCode();

    if (authMode === 'register') {
        if (existing) { alert("Bu email bilan akkaunt allaqachon mavjud. Iltimos, tizimga kiring."); return; }
        const name = document.getElementById('auth-name').value.trim();
        currentUser = { name, email, avatar: `https://picsum.photos/seed/${name}/100/100`, isPro: false, isAdmin: false };
    } else {
        if (!existing) { alert("Bunday akkaunt topilmadi. Avval \"Akkaunt yaratish\" tugmasi orqali ro'yxatdan o'ting."); return; }
        currentUser = {
            name: existing.name,
            email: existing.email,
            avatar: `https://picsum.photos/seed/${existing.name}/100/100`,
            isPro: isProActive(existing),
            isAdmin: false,
            ...(existing.proUntil ? { proPlan: existing.proPlan || 'monthly', proUntil: existing.proUntil } : {})
        };
    }
    localStorage.setItem('eduflow_current_user', JSON.stringify(currentUser));
    registerUserInRegistry(currentUser);
    updateHeaderAuthUI();
    closeAuthModal();
    navigateTo('home');
}

function logoutUser() {
    currentUser = null;
    localStorage.removeItem('eduflow_current_user');
    checkAccountStatus();
    updateHeaderAuthUI();
    navigateTo('home');
}

// EDIT PROFILE MODAL
function openEditNameModal() {
    if (!currentUser) return;
    document.getElementById('edit-name-input').value = currentUser.name || '';
    document.getElementById('edit-email-input').value = currentUser.email || '';
    document.getElementById('edit-avatar-input').value = currentUser.avatar || '';
    document.getElementById('edit-bio-input').value = currentUser.bio || '';
    document.getElementById('edit-name-modal').classList.remove('hidden');
}

function closeEditNameModal() { document.getElementById('edit-name-modal').classList.add('hidden'); }

function handleEditNameSubmit(e) {
    e.preventDefault();
    if (!currentUser) return;

    const oldEmail = currentUser.email;
    currentUser.name = document.getElementById('edit-name-input').value;
    currentUser.email = document.getElementById('edit-email-input').value;
    currentUser.avatar = document.getElementById('edit-avatar-input').value || currentUser.avatar;
    currentUser.bio = document.getElementById('edit-bio-input').value;

    localStorage.setItem('eduflow_current_user', JSON.stringify(currentUser));
    registerUserInRegistry(currentUser, oldEmail);
    updateHeaderAuthUI();
    closeEditNameModal();
    navigateTo(currentView, selectedCourseId);
}

        ["Python va React yordamida veb-ilovaning ham server (backend), ham ko'rinadigan (frontend) qismini yaratishga yo'naltirilgan kurs. Darslar dasturlash asoslaridan boshlanadi: o'zgaruvchilar va ma'lumot turlari, if / else shartlari, sikllar va funksiyalar. Dasturlashda tajribangiz bo'lmasa ham boshlashingiz mumkin.", "A course aimed at building both the server (backend) and the visible (frontend) parts of a web app with Python and React. The lessons start with programming basics: variables and data types, if / else conditions, loops and functions. You can start even with no programming experience.", "Курс о создании и серверной (backend), и видимой (frontend) части веб-приложения на Python и React. Уроки начинаются с основ программирования: переменные и типы данных, условия if / else, циклы и функции. Начать можно даже без опыта в программировании."],

        ["Ijtimoiy tarmoqlarda biznesni targ'ib qilishning zamonaviy usullari kursi: maqsadli auditoriyani aniqlash, kontent reja tuzish, reklama yuritish va natijalarni tahlil qilish. SMM mutaxassisi bo'lmoqchi yoki o'z biznesini tarmoqlarda rivojlantirmoqchi bo'lganlarga mos.", "A course on modern ways to promote a business on social media: defining the target audience, planning content, running ads and analyzing the results. Suitable for those who want to become an SMM specialist or grow their own business on social networks.", "Курс о современных способах продвижения бизнеса в социальных сетях: определение целевой аудитории, составление контент-плана, запуск рекламы и анализ результатов. Подходит тем, кто хочет стать SMM-специалистом или развивать свой бизнес в соцсетях."],

            re: /^Kurs #(\d+) yangilandi: narx (.+) UZS(, video saqlandi)?\.$/,
            en: m => `Course #${m[1]} updated: price ${m[2]} UZS${m[3] ? ', video saved' : ''}.`,
            ru: m => `Курс #${m[1]} обновлён: цена ${m[2]} UZS${m[3] ? ', видео сохранено' : ''}.`
        },
        {
            re: /^"(.*)" kategoriyasidagi (\d+) ta kursga (shu videoni qo'llaymizmi|videoni o'chiramizmi)\?$/,
            en: m => `Do you want to ${m[3].startsWith('shu') ? 'apply this video to' : 'remove the video from'} ${m[2]} courses in the "${MAP.has(m[1]) ? MAP.get(m[1]).en : m[1]}" category?`,
            ru: m => `${m[3].startsWith('shu') ? 'Применить это видео к' : 'Удалить видео у'} ${m[2]} курсам категории «${MAP.has(m[1]) ? MAP.get(m[1]).ru : m[1]}»?`
        }
    ];

    function tr(raw, lang) {
        const key = norm(raw);
        if (!key) return null;
        const e = MAP.get(key);
        if (e) return lang === 'uz' ? (e.uz !== undefined ? e.uz : null) : e[lang];
        if (lang === 'uz') return null;
        for (const p of P) {
            const m = key.match(p.re);
            if (m) { const out = p[lang](m); if (out) return out; }
        }
        return null;
    }
    const L = () => (typeof currentLang !== 'undefined' && currentLang) || 'uz';

    const noTr = n => { const e = n.nodeType === 1 ? n : n.parentElement; return !!(e && e.closest && e.closest('[translate="no"]')); };
    function doText(n) {
        if (noTr(n)) return;
        const cur = n.nodeValue, lang = L();
        const src = (n.__t !== undefined && cur === n.__t) ? n.__o : cur;
        const t = tr(src, lang);
        if (t !== null) {
            const lead = src.match(/^\s*/)[0], trail = src.match(/\s*$/)[0];
            const out = lead + t + trail;
            if (cur !== out) n.nodeValue = out;
            n.__o = src; n.__t = out;
        } else if (src !== cur) {
            n.nodeValue = src; n.__t = undefined; n.__o = undefined;
        }
    }
    const ATTRS = ['placeholder', 'title', 'aria-label', 'alt'];
    function doEl(el) {
        const lang = L();
        el.__a = el.__a || {};
        for (const a of ATTRS) {
            if (!el.hasAttribute(a)) continue;
            const cur = el.getAttribute(a), rec = el.__a[a];
            const src = (rec && cur === rec.t) ? rec.o : cur;
            const t = tr(src, lang);
            if (t !== null) { if (cur !== t) el.setAttribute(a, t); el.__a[a] = { o: src, t }; }
            else if (src !== cur) { el.setAttribute(a, src); delete el.__a[a]; }
        }
    }
    function walk(root) {
        if (root.nodeType === 3) { doText(root); return; }
        if (root.nodeType !== 1) return;
        const tag = root.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || noTr(root)) return;
        doEl(root);
        const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
            acceptNode: n => (n.nodeType === 1 && (n.tagName === 'SCRIPT' || n.tagName === 'STYLE' || n.getAttribute('translate') === 'no')) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
        });
        let n;
        while ((n = w.nextNode())) { if (n.nodeType === 3) doText(n); else doEl(n); }
    }

    const TITLES = { uz: "EduFlow - Onlayn Ta'lim Platformasi", en: "EduFlow - Online Education Platform", ru: "EduFlow — онлайн-платформа обучения" };
    const OPTS = { childList: true, subtree: true, characterData: true };
    const mo = new MutationObserver(recs => {
        mo.disconnect();
        try {
            for (const r of recs) {
                if (r.type === 'characterData') doText(r.target);
                else r.addedNodes.forEach(walk);
            }
        } finally { mo.observe(document.body, OPTS); }
    });
    function applyAll() {
        mo.disconnect();
        try {
            const l = L();
            document.documentElement.lang = l;
            document.title = (window.pageTitle && window.pageTitle(l)) || TITLES[l] || TITLES.uz;
            walk(document.body);
        } finally { mo.observe(document.body, OPTS); }
    }

    // alert / confirm xabarlarini tarjima qilish
    const _alert = window.alert.bind(window), _confirm = window.confirm.bind(window);
    const msg = m => { const s = String(m); const t = tr(s, L()); return t !== null ? t : s; };
    window.alert = m => _alert(msg(m));
    window.confirm = m => _confirm(msg(m));

    // Til almashganda butun sahifani (modal, footer, admin) qayta tarjima qilish
    const _change = window.changeLanguage;
    window.changeLanguage = function (lang) { _change(lang); applyAll(); };

    window.applyI18nAll = applyAll;
    applyAll();
    document.addEventListener('DOMContentLoaded', applyAll);
    window.addEventListener('load', applyAll);
})();
    </script>
</body>
